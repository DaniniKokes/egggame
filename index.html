<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg & Lilek Catch Game</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #2b2b2b;
            border: 4px solid #444;
            cursor: none; /* Skryje kurzor, máme vlastní postavu */
        }
        h1 { margin: 5px; font-size: 24px; }
    </style>
</head>
<body>

    <h1>Egg & Lilek Game</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- DEFINICE HRY ---

        // Pozice oken na budovách (pro start lilku)
        const buildingWindows = [];
        // Levá budova (okna na x=90, různé y)
        for(let y = 180; y < 450; y += 100) {
            buildingWindows.push({ x: 90, y: y });
        }
        // Pravá budova (okna na x=canvas.width - 90)
        for(let y = 180; y < 450; y += 100) {
            buildingWindows.push({ x: canvas.width - 90, y: y });
        }

        // Hráč (postava dole)
        let player = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 70,
            width: 60,
            height: 60,
            score: 0
        };

        // Lilek (protáhlý)
        let egg = {
            x: 0, y: 0,
            radiusX: 10, // Šířka
            radiusY: 15, // Výška (protáhlý)
            vx: 0, vy: 0,
            active: false
        };

        // Funkce pro reset lilku do náhodného okna
        function resetEggToWindow() {
            const windowIndex = Math.floor(Math.random() * buildingWindows.length);
            const startWindow = buildingWindows[windowIndex];

            egg.x = startWindow.x;
            egg.y = startWindow.y;
            egg.vy = 0;
            // Vystřelí ho trochu do strany podle toho, na které je budově
            egg.vx = (startWindow.x < canvas.width / 2) ? 3 : -3;
            egg.active = true;
        }

        // Spuštění hry
        resetEggToWindow();

        // Ovládání myší
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = (e.clientX - rect.left) - player.width / 2;
            // Hranice
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
        });

        function update() {
            if (!egg.active) return;

            // Pohyb lilku
            egg.x += egg.vx;
            egg.y += egg.vy;
            // Gravitace
            egg.vy += 0.2;

            // Odrazy od stěn (budov)
            if (egg.x <= 20 || egg.x >= canvas.width - 20) {
                egg.vx *= -1;
            }

            // Kontrola chycení (hlavou postavy)
            if (
                egg.y + egg.radiusY >= player.y && // Je dostatečně nízko
                egg.x > player.x && // Je vlevo od kraje postavy
                egg.x < player.x + player.width // Je vpravo od kraje postavy
            ) {
                player.score += 1;
                resetEggToWindow(); // Znovu vyskočí z okna
            }

            // Pokud spadne na zem
            if (egg.y > canvas.height) {
                player.score = 0; // Game Over
                resetEggToWindow();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Budovy a okna
            ctx.fillStyle = "#555";
            ctx.fillRect(0, 150, 100, 350); // Levá
            ctx.fillRect(canvas.width - 100, 150, 100, 350); // Pravá

            // Okna
            ctx.fillStyle = "#333";
            buildingWindows.forEach(win => {
                ctx.fillRect(win.x - 15, win.y - 25, 30, 50);
            });

            // 2. Postava (dole)
            // Tělo
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Hlava
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y - 15, 20, 0, Math.PI*2);
            ctx.fill();
            // Oči
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(player.x + player.width/2 - 8, player.y - 18, 4, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(player.x + player.width/2 + 8, player.y - 18, 4, 0, Math.PI*2); ctx.fill();


            // 3. Lilek (protáhlý s očima)
            if (egg.active) {
                ctx.fillStyle = "#9b59b6";
                ctx.beginPath();
                // Elipsa (x, y, rotation, startAngle, endAngle, anticlockwise)
                ctx.ellipse(egg.x, egg.y, egg.radiusX, egg.radiusY, 0, 0, Math.PI * 2);
                ctx.fill();
                // Stopka
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(egg.x - 3, egg.y - egg.radiusY - 6, 6, 6);
                // Oči lilku
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 5, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 5, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 5, 1.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 5, 1.5, 0, Math.PI*2); ctx.fill();
            }

            // Skóre
            ctx.fillStyle = "white";
            ctx.font = "26px sans-serif";
            ctx.fillText("Skóre: " + player.score, canvas.width/2 - 60, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
