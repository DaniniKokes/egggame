<!DOCTYPE html>
<html>
<body style="background:#222; display:flex; justify-content:center; align-items:center; height:100vh; margin:0;">
    <div id="game" style="width:400px; height:300px; border:4px solid white; position:relative; background:#333;">
        <div id="hrac" style="width:40px; height:40px; background:gold; position:absolute; bottom:0; left:180px;"></div>
    </div>
    <script>
        const hrac = document.getElementById('hrac');
        let poziceX = 180;
        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' && poziceX > 0) poziceX -= 20;
            if(e.key === 'ArrowRight' && poziceX < 360) poziceX += 20;
            hrac.style.left = poziceX + 'px';
        });
    </script>
</body>
</html>
