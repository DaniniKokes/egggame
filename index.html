<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egg & Eggplant - PSG1 Deluxe Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #09090c; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #1a1a24; 
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            background: #1f1f2e; 
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script> 
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let isConnected = false;
        let playTokenBalance = 500; 
        let freeTrialMode = false;
        const FREE_TRIAL_LIMIT = 50;

        let cursorX = canvas.width / 2;
        let cursorY = canvas.height / 2;
        const cursorSpeed = 7;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusicInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                osc.frequency.setValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'shop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(950, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hover') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.02, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            }
        }

        function startBackgroundMusic() {
            if (backgroundMusicInterval) return;
            const notes = [220, 277, 330, 440, 554, 330, 277];
            let index = 0;
            backgroundMusicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[index], now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                index = (index + 1) % notes.length;
            }, 200);
        }

        let gameStarted = false;

        const bgImg = new Image();
        bgImg.src = "hlavni stranka.png";

        const playerLeftImg = new Image();
        playerLeftImg.src = "player.png l.png";

        const playerRightImg = new Image();
        playerRightImg.src = "player.png r.png";

        const playerCenterImg = new Image();
        playerCenterImg.src = "player1.png";

        const lilekImg = new Image();
        lilekImg.src = "lilek.png";

        const positions = [
            { x: 340, y: 350, side: 'left' },   
            { x: 340, y: 480, side: 'left' },   
            { x: 560, y: 350, side: 'right' },  
            { x: 560, y: 480, side: 'right' },  
            { x: 450, y: 565, side: 'center' }  
        ];

        const rooms = [
            { id: 0, side: 'left',  y: 245, startX: 80, endX: 300 },  
            { id: 1, side: 'left',  y: 380, startX: 80, endX: 300 },  
            { id: 2, side: 'right', y: 245, startX: 820, endX: 600 },  
            { id: 3, side: 'right', y: 380, startX: 820, endX: 600 }   
        ];

        let currentPosIndex = 4; 
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = false;
        let isShopOpen = false;
        let shopTriggered = false; 
        let unlockedBoxes = { box1: true, box2: false, box3: false };
        let activeBox = 1; 
        let txPending = false;
        let txMessage = "";
        let catchAnimFrames = 0; 
        let baseSpeed = 0.6; 
        let animTimer = 0;

        let prevGamepadState = { buttons: {}, axes: {} };

        function handleGamepadInput() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (!gamepads[0]) return;
            const gp = gamepads[0];

            const buttonPressed = (index) => {
                let pressed = gp.buttons[index] && gp.buttons[index].pressed;
                let wasPressed = prevGamepadState.buttons[index] || false;
                prevGamepadState.buttons[index] = pressed;
                return pressed && !wasPressed;
            };

            startBackgroundMusic();

            let axisX = gp.axes[0] || 0; 
            let axisY = gp.axes[1] || 0; 

            let dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
            let dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
            let dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
            let dpadRight = gp.buttons[15] && gp.buttons[15].pressed;

            if (!gameStarted || isShopOpen || isGameOver) {
                if (Math.abs(axisX) > 0.2) cursorX += axisX * cursorSpeed;
                if (Math.abs(axisY) > 0.2) cursorY += axisY * cursorSpeed;
                if (dpadLeft) cursorX -= cursorSpeed;
                if (dpadRight) cursorX += cursorSpeed;
                if (dpadUp) cursorY -= cursorSpeed;
                if (dpadDown) cursorY += cursorSpeed;

                cursorX = Math.max(0, Math.min(canvas.width, cursorX));
                cursorY = Math.max(0, Math.min(canvas.height, cursorY));
            }

            if (!isPaused && !isGameOver && !isShopOpen && gameStarted) {
                if ((axisY < -0.5 || dpadUp) && !prevGamepadState.movedY) {
                    if (currentPosIndex === 4) currentPosIndex = 1;
                    else if (currentPosIndex === 1) currentPosIndex = 0;
                    else if (currentPosIndex === 3) currentPosIndex = 2;
                    prevGamepadState.movedY = true;
                } else if (axisY >= -0.5 && axisY <= 0.5 && !dpadUp && !dpadDown) {
                    prevGamepadState.movedY = false;
                }

                if ((axisY > 0.5 || dpadDown) && !prevGamepadState.movedYDown) {
                    if (currentPosIndex === 0) currentPosIndex = 1;
                    else if (currentPosIndex === 2) currentPosIndex = 3;
                    else if (currentPosIndex === 1 || currentPosIndex === 3) currentPosIndex = 4;
                    prevGamepadState.movedYDown = true;
                } else if (axisY >= -0.5 && axisY <= 0.5 && !dpadDown) {
                    prevGamepadState.movedYDown = false;
                }

                if ((axisX < -0.5 || dpadLeft) && !prevGamepadState.movedX) {
                    if (currentPosIndex === 2) currentPosIndex = 0;
                    else if (currentPosIndex === 3) currentPosIndex = 1;
                    else if (currentPosIndex === 4) currentPosIndex = 1;
                    prevGamepadState.movedX = true;
                } else if (axisX >= -0.5 && axisX <= 0.5 && !dpadLeft && !dpadRight) {
                    prevGamepadState.movedX = false;
                }

                if ((axisX > 0.5 || dpadRight) && !prevGamepadState.movedXRight) {
                    if (currentPosIndex === 0) currentPosIndex = 2;
                    else if (currentPosIndex === 1) currentPosIndex = 3;
                    else if (currentPosIndex === 4) currentPosIndex = 3;
                    prevGamepadState.movedXRight = true;
                } else if (axisX >= -0.5 && axisX <= 0.5 && !dpadRight) {
                    prevGamepadState.movedXRight = false;
                }
            }

            if (buttonPressed(0) || buttonPressed(9)) {
                triggerClickAt(cursorX, cursorY);
            }

            if (buttonPressed(3) || buttonPressed(8)) {
                if (gameStarted && !isGameOver && !isShopOpen) {
                    isPaused = !isPaused;
                    playSound('shop');
                }
            }
        }

        function drawEnvironment() {
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#12121a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Kreslení původních dřevěných ramp (balkónků)
            const drawReplicaPlatform = (x, y) => {
                ctx.save();
                ctx.fillStyle = "#3b2f2f";
                ctx.fillRect(x - 45, y, 90, 12);
                ctx.fillStyle = "#5c4033";
                ctx.fillRect(x - 45, y + 12, 90, 5);
                ctx.fillStyle = "#221919";
                ctx.fillRect(x - 30, y + 17, 10, 8);
                ctx.fillRect(x + 20, y + 17, 10, 8);
                ctx.strokeStyle = "#8b5a2b";
                ctx.lineWidth = 2;
                ctx.strokeRect(x - 45, y, 90, 12);
                ctx.restore();
            };

            drawReplicaPlatform(340, 350);
            drawReplicaPlatform(340, 480);
            drawReplicaPlatform(560, 350);
            drawReplicaPlatform(560, 480);
        }

        function drawTopBoxes() {
            let startX = canvas.width / 2 - 165;
            let boxWidth = 100;
            let boxHeight = 45;
            let y = 15;
            const boxesData = [
                { id: 1, name: "100 EGG", unlocked: true },
                { id: 2, name: "250 EGG", unlocked: unlockedBoxes.box2 },
                { id: 3, name: "500 EGG", unlocked: unlockedBoxes.box3 }
            ];
            boxesData.forEach((b, index) => {
                let x = startX + (index * 115);
                ctx.fillStyle = activeBox === b.id ? "#3498db" : (b.unlocked ? "#9b59b6" : "#2c2c38");
                ctx.fillRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.fillStyle = activeBox === b.id ? "#5dade2" : (b.unlocked ? "#af7ac5" : "#3b3b4f");
                ctx.fillRect(x - 4, y, boxWidth + 8, 12);
                ctx.strokeStyle = b.unlocked ? "#f1c40f" : "#444";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.strokeRect(x - 4, y, boxWidth + 8, 12);
                ctx.fillStyle = b.unlocked ? "#ffffff" : "#777";
                ctx.font = "bold 12px 'Courier New', Courier, monospace";
                ctx.fillText(b.name, x + 12, y + 32);
            });
        }

        window.addEventListener("keydown", (e) => {
            startBackgroundMusic();
            if (!gameStarted) return;
            if (isGameOver) {
                if (e.key === "Enter" || e.code === "Space") restartGame();
                return;
            }
            if (isShopOpen) {
                if (!txPending && (e.key === "Escape" || e.key === "Enter")) isShopOpen = false;
                return;
            }
            if (e.code === "Space") {
                isPaused = !isPaused;
                playSound('shop');
                return;
            }
            if (isPaused) return;

            if (e.key === "ArrowUp") {
                if (currentPosIndex === 4) currentPosIndex = 1;
                else if (currentPosIndex === 1) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                else if (currentPosIndex === 2) currentPosIndex = 3;
                else if (currentPosIndex === 1 || currentPosIndex === 3) currentPosIndex = 4;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 1;
                else if (currentPosIndex === 4) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                else if (currentPosIndex === 1) currentPosIndex = 3;
                else if (currentPosIndex === 4) currentPosIndex = 3;
            }
        });

        function triggerClickAt(mouseX, mouseY) {
            startBackgroundMusic();

            if (!gameStarted) {
                if (mouseX >= canvas.width / 2 - 240 && mouseX <= canvas.width / 2 - 20 && mouseY >= canvas.height / 2 - 20 && mouseY <= canvas.height / 2 + 40) {
                    isConnected = false; freeTrialMode = true; gameStarted = true; playSound('shop'); return;
                }
                if (mouseX >= canvas.width / 2 + 20 && mouseX <= canvas.width / 2 + 240 && mouseY >= canvas.height / 2 - 20 && mouseY <= canvas.height / 2 + 40) {
                    isConnected = true; freeTrialMode = false; gameStarted = true; playSound('shop'); return;
                }
                return;
            }

            if (isGameOver) {
                if (mouseX >= canvas.width / 2 - 120 && mouseX <= canvas.width / 2 + 120 && mouseY >= canvas.height / 2 + 40 && mouseY <= canvas.height / 2 + 100) {
                    restartGame();
                    playSound('shop');
                    return;
                }
                return;
            }

            if (isShopOpen && !txPending) {
                if (mouseX >= canvas.width / 2 - 270 && mouseX <= canvas.width / 2 - 110 && mouseY >= 160 && mouseY <= 335) {
                    activeBox = 1; playSound('shop'); return;
                }
                if (mouseX >= canvas.width / 2 - 80 && mouseX <= canvas.width / 2 + 80 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box2) { buyBox('box2', 50, 2); } else { activeBox = 2; playSound('shop'); }
                    return;
                }
                if (mouseX >= canvas.width / 2 + 110 && mouseX <= canvas.width / 2 + 270 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box3) { buyBox('box3', 100, 3); } else { activeBox = 3; playSound('shop'); }
                    return;
                }
                if (mouseY >= 430 && mouseY <= 480) {
                    isShopOpen = false; playSound('shop'); return;
                }
                return;
            }

            if (!isPaused && !isGameOver) {
                let closestIndex = 0;
                let minDist = 9999;
                positions.forEach((pos, idx) => {
                    let dist = Math.hypot(mouseX - pos.x, mouseY - pos.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closestIndex = idx;
                    }
                });
                if (minDist < 150) {
                    currentPosIndex = closestIndex;
                }
            }
        }

        window.addEventListener("click", (e) => {
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            let mouseX = (e.clientX - rect.left) * scaleX;
            let mouseY = (e.clientY - rect.top) * scaleY;
            cursorX = mouseX;
            cursorY = mouseY;
            triggerClickAt(mouseX, mouseY);
        });

        function buyBox(boxKey, price, boxId) {
            if (playTokenBalance < price) {
                txMessage = "Not enough PLAY tokens!";
                setTimeout(() => { txMessage = ""; }, 2500);
                return;
            }
            txPending = true;
            txMessage = "Processing transaction...";
            setTimeout(() => {
                playTokenBalance -= price;
                unlockedBoxes[boxKey] = true;
                activeBox = boxId;
                txPending = false;
                txMessage = "Successfully unlocked! ❤️";
                playSound('shop');
                setTimeout(() => { txMessage = ""; }, 3000);
            }, 1000);
        }

        function drawPlayerWithBasket() {
            let targetPos = positions[currentPosIndex];
            let width = 72;
            let height = 100;
            
            animTimer += 0.1;
            let bounce = Math.sin(animTimer) * 2;
            let shake = catchAnimFrames > 0 ? (Math.random() * 6 - 3) : 0;
            if (catchAnimFrames > 0) catchAnimFrames--;

            let renderX = targetPos.x - width / 2 + shake;
            let renderY = targetPos.y - height + 10 + bounce;

            ctx.save();
            
            let imgToDraw = playerCenterImg;
            if (targetPos.side === 'left') imgToDraw = playerLeftImg;
            else if (targetPos.side === 'right') imgToDraw = playerRightImg;

            if (imgToDraw.complete && imgToDraw.naturalWidth !== 0) {
                ctx.drawImage(imgToDraw, renderX, renderY, width, height);
            } else {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(renderX, renderY, width, height);
            }
            ctx.restore();
        }

        let lilky = [];
        let spawningLilky = []; 
        let spawnCounter = 0;

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];
            
            let currentCycleScore = score % 100;
            let dynamicSpeed = 0.6 + (currentCycleScore * 0.003);

            lilky.push({
                roomIndex: rIdx, x: r.startX, y: r.y - 10, isLeft: r.side === 'left',
                speed: dynamicSpeed, state: 'walking', angle: 0, counted: false
            });
        }

        function updateAndDrawLilky() {
            if (!isPaused && !isGameOver && !isShopOpen) {
                spawnCounter++;
                let currentSpawnInterval = Math.max(70, 150 - (score * 2));
                if (spawnCounter > currentSpawnInterval) { 
                    spawnLilek();
                    spawnCounter = 0;
                }
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (!isPaused && !isGameOver && !isShopOpen) {
                    if (l.state === 'walking') {
                        l.x += l.isLeft ? l.speed : -l.speed;
                        l.y = r.y - 10; 
                        l.angle += l.isLeft ? 0.04 : -0.04;
                        
                        if ((l.isLeft && l.x >= r.endX) || (!l.isLeft && l.x <= r.endX)) {
                            l.state = 'at_balcony';
                        }
                    } else if (l.state === 'at_balcony') {
                        if (currentPosIndex === l.roomIndex) {
                            playSound('catch'); 
                            catchAnimFrames = 12; 
                            
                            spawningLilky.push({
                                x: positions[currentPosIndex].x,
                                y: positions[currentPosIndex].y - 30,
                                targetY: positions[currentPosIndex].y + 10,
                                progress: 0
                            });

                            lilky.splice(i, 1); 
                            score++;
                            
                            let currentCycleScore = score % 100;
                            baseSpeed = 0.6 + (currentCycleScore * 0.003); 

                            if (freeTrialMode && score >= FREE_TRIAL_LIMIT) {
                                isGameOver = true; playSound('gameover');
                            }
                            if (score >= 100 && !shopTriggered) {
                                shopTriggered = true; isShopOpen = true; playSound('shop');
                            }
                            continue;
                        } else {
                            l.state = 'falling';
                        }
                    } else if (l.state === 'falling') {
                        l.y += 6; 
                        l.angle += 0.1;
                        let groundY = canvas.height - 15; 
                        if (l.y >= groundY) {
                            l.y = groundY;
                            l.state = 'ground';
                            if (!l.counted) {
                                playSound('drop'); 
                                lives--;
                                l.counted = true;
                                if (lives <= 0) { playSound('gameover'); isGameOver = true; }
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.rotate(l.angle);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -14, -14, 28, 28);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                if (!isPaused && l.state === 'ground' && Math.random() < 0.03) {
                    lilky.splice(i, 1);
                }
            }

            for (let i = spawningLilky.length - 1; i >= 0; i--) {
                let sl = spawningLilky[i];
                if (!isPaused && !isGameOver && !isShopOpen) {
                    sl.progress += 0.15;
                    sl.y += 3; 
                    if (sl.progress >= 1) {
                        spawningLilky.splice(i, 1);
                        continue;
                    }
                }
                ctx.save();
                ctx.translate(sl.x, sl.y);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -14, -14, 28, 28);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        function drawVirtualCursor() {
            if (!gameStarted || isShopOpen || isGameOver) {
                ctx.save();
                ctx.strokeStyle = "#ffffff";
                ctx.fillStyle = "#f1c40f";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cursorX, cursorY);
                ctx.lineTo(cursorX + 12, cursorY + 16);
                ctx.lineTo(cursorX + 6, cursorY + 16);
                ctx.lineTo(cursorX, cursorY + 22);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawStartScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 36px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("EGG & EGGPLANT", canvas.width / 2, canvas.height / 2 - 110);
            ctx.fillStyle = "#3498db"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText("PSG1 DELUXE EDITION", canvas.width / 2, canvas.height / 2 - 70);

            ctx.fillStyle = "#4a69bd"; ctx.fillRect(canvas.width / 2 - 240, canvas.height / 2 - 20, 220, 60);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 240, canvas.height / 2 - 20, 220, 60);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillText("WITHOUT WALLET", canvas.width / 2 - 130, canvas.height / 2 + 15);

            ctx.fillStyle = "#2ecc71"; ctx.fillRect(canvas.width / 2 + 20, canvas.height / 2 - 20, 220, 60);
            ctx.strokeRect(canvas.width / 2 + 20, canvas.height / 2 - 20, 220, 60);
            ctx.fillStyle = "#ffffff";
            ctx.fillText("CONNECT WALLET", canvas.width / 2 + 130, canvas.height / 2 + 15);

            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("🎮 CONTROLS: D-Pad / Sticks = Move Cursor & Player", canvas.width / 2, canvas.height / 2 + 80);
            ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillText("Use Joystick/Cursor to select & press [A] to SELECT", canvas.width / 2, canvas.height / 2 + 110);

            ctx.textAlign = "start";
        }

        function drawUI() {
            ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(15, 15, 130, 45, 8); ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = "#3498db"; ctx.fillText("SCORE", 25, 33);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText(score, 25, 52);

            drawTopBoxes();

            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(canvas.width - 175, 15, 160, 45, 8); ctx.fill();
            ctx.strokeStyle = freeTrialMode ? "#4a69bd" : "#2ecc71"; ctx.stroke();
            ctx.fillStyle = freeTrialMode ? "#4a69bd" : "#2ecc71"; ctx.font = "bold 13px 'Courier New', Courier, monospace";
            if (freeTrialMode) {
                ctx.fillText("🎮 FREE PLAY", canvas.width - 165, 33);
            } else {
                ctx.fillText("💰 " + playTokenBalance + " PLAY", canvas.width - 165, 33);
            }

            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("Lives: " + "❤️".repeat(lives), 15, 85);
        }

        function drawShopScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 30px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("COMMUNITY SHOP & BASKETS", canvas.width / 2, 75);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.strokeStyle = activeBox === 1 ? "#2ecc71" : "#3498db"; ctx.strokeRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.fillStyle = "#3498db"; ctx.fillText("100 EGG BOX", canvas.width / 2 - 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("FREE", canvas.width / 2 - 190, 245);
            ctx.fillStyle = activeBox === 1 ? "#2ecc71" : "#fff"; ctx.fillText(activeBox === 1 ? "SELECTED" : "SELECT", canvas.width / 2 - 190, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.strokeStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f"); ctx.strokeRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.fillStyle = "#f1c40f"; ctx.fillText("250 EGG BOX", canvas.width / 2, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("50 PLAY", canvas.width / 2, 220);
            ctx.fillStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f");
            ctx.fillText(activeBox === 2 ? "SELECTED" : (unlockedBoxes.box2 ? "SELECT" : "BUY"), canvas.width / 2, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.strokeStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c"); ctx.strokeRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.fillStyle = "#e74c3c"; ctx.fillText("500 EGG BOX", canvas.width / 2 + 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("100 PLAY", canvas.width / 2 + 190, 220);
            ctx.fillStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c");
            ctx.fillText(activeBox === 3 ? "SELECTED" : (unlockedBoxes.box3 ? "SELECT" : "BUY"), canvas.width / 2 + 190, 295);

            if (txMessage !== "") {
                ctx.fillStyle = "#e67e22"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
                ctx.fillText(txMessage, canvas.width / 2, 385);
            }
            ctx.fillStyle = "#aaa"; ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillText("Click here or press ENTER to return to game", canvas.width / 2, 450);
            ctx.textAlign = "start";
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Press PAUSE button to continue", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);
            ctx.fillStyle = "#ffffff"; ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Eggplants caught: " + score, canvas.width / 2, canvas.height / 2);

            ctx.fillStyle = "#2ecc71"; ctx.fillRect(canvas.width / 2 - 120, canvas.height / 2 + 40, 240, 55);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 120, canvas.height / 2 + 40, 240, 55);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText("RESTART", canvas.width / 2, canvas.height / 2 + 75);

            ctx.textAlign = "start";
        }

        function restartGame() {
            gameStarted = false; freeTrialMode = false;
            score = 0; lives = 3; baseSpeed = 0.6; lilky = []; spawningLilky = []; spawnCounter = 0;
            isGameOver = false; isPaused = false; isShopOpen = false; shopTriggered = false;
            unlockedBoxes = { box1: true, box2: false, box3: false }; activeBox = 1;
            currentPosIndex = 4;
        }

        function gameLoop() {
            handleGamepadInput();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(); 
            
            if (!gameStarted) { 
                drawStartScreen(); 
                drawVirtualCursor();
                requestAnimationFrame(gameLoop); 
                return; 
            }
            if (isGameOver) { 
                updateAndDrawLilky(); 
                drawPlayerWithBasket(); 
                drawUI(); 
                drawGameOver(); 
                drawVirtualCursor();
                requestAnimationFrame(gameLoop); 
                return; 
            }
            if (isShopOpen) { 
                drawShopScreen(); 
                drawVirtualCursor();
                requestAnimationFrame(gameLoop); 
                return; 
            }
            if (isPaused) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawPauseScreen(); requestAnimationFrame(gameLoop); return; }

            updateAndDrawLilky();
            drawPlayerWithBasket();      
            drawUI();
            requestAnimationFrame(gameLoop);
        }

        bgImg.onload = () => { gameLoop(); };
        if(bgImg.complete) { gameLoop(); }
    </script>
</body>
</html>
