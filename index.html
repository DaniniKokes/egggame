<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg & Lilek - PSG1 Edition</title>
    <style>
        body {
            margin: 0;
            background: #09090b;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #1a1005;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }
        h1 { margin: 8px; font-size: 20px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <h1>PSG1 DevKit - Egg & Lilek</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Okna budov, ze kterých padají lilky
        const buildingWindows = [
            { x: 90, y: 180 },
            { x: 90, y: 300 },
            { x: canvas.width - 90, y: 180 },
            { x: canvas.width - 90, y: 300 }
        ];

        // Hráč (ovládaný přes D-pad / šipky)
        let player = {
            x: canvas.width / 2 - 30,
            y: canvas.height - 75,
            width: 60,
            height: 60,
            speed: 8,
            score: 0,
            dx: 0
        };

        // Lilek
        let egg = {
            x: 0, y: 0,
            radiusX: 12,
            radiusY: 17,
            vx: 0, vy: 0,
            active: false
        };

        function resetEggToWindow() {
            const startWindow = buildingWindows[Math.floor(Math.random() * buildingWindows.length)];
            egg.x = startWindow.x;
            egg.y = startWindow.y;
            egg.vy = 0;
            egg.vx = (startWindow.x < canvas.width / 2) ? 3.2 : -3.2;
            egg.active = true;
        }

        resetEggToWindow();

        // Ovládání pomocí klávesnice (emulace D-padu na PSG1)
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
                player.dx = -player.speed;
            } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
                player.dx = player.speed;
            }
        });

        window.addEventListener("keyup", (e) => {
            if (
                (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") && player.dx < 0 ||
                (e.key === "ArrowRight" || e.key === "d" || e.key === "D") && player.dx > 0
            ) {
                player.dx = 0;
            }
        });

        function update() {
            // Pohyb hráče
            player.x += player.dx;
            // Omezení v rámci obrazovky (mezi budovami)
            if (player.x < 110) player.x = 110;
            if (player.x > canvas.width - 110 - player.width) player.x = canvas.width - 110 - player.width;

            if (!egg.active) return;

            // Pohyb lilku
            egg.x += egg.vx;
            egg.y += egg.vy;
            egg.vy += 0.22; // Gravitace

            // Odrazy od budov
            if (egg.x <= 110 || egg.x >= canvas.width - 110) {
                egg.vx *= -1;
            }

            // Chycení postavičkou
            if (
                egg.y + egg.radiusY >= player.y &&
                egg.x > player.x &&
                egg.x < player.x + player.width
            ) {
                player.score += 1;
                resetEggToWindow();
            }

            // Pád na zem (game over / reset skóre)
            if (egg.y > canvas.height) {
                player.score = 0;
                resetEggToWindow();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dřevěná podlaha
            ctx.fillStyle = "#26170a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#170e06";
            ctx.lineWidth = 2;
            for(let i = 0; i < canvas.height; i += 35) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // Budovy po stranách
            ctx.fillStyle = "#1e272e";
            ctx.fillRect(0, 0, 110, canvas.height);
            ctx.fillRect(canvas.width - 110, 0, 110, canvas.height);

            // Okna
            ctx.fillStyle = "#00d2d3";
            buildingWindows.forEach(win => {
                ctx.fillRect(win.x - 15, win.y - 25, 30, 50);
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(win.x - 15, win.y - 25, 30, 50);
            });

            // Postava
            ctx.fillStyle = "#ff9f43";
            ctx.fillRect(player.x + 10, player.y + 20, player.width - 20, player.height - 20);
            // Hlava
            ctx.fillStyle = "#ffcccc";
            ctx.fillRect(player.x + 12, player.y, 36, 22);
            // Vlasy
            ctx.fillStyle = "#2c2c54";
            ctx.fillRect(player.x + 10, player.y - 6, 40, 10);
            // Oči
            ctx.fillStyle = "#000";
            ctx.fillRect(player.x + 20, player.y + 7, 4, 4);
            ctx.fillRect(player.x + 36, player.y + 7, 4, 4);

            // Lilek
            if (egg.active) {
                ctx.fillStyle = "#9b59b6";
                ctx.beginPath();
                ctx.ellipse(egg.x, egg.y, egg.radiusX, egg.radiusY, 0, 0, Math.PI * 2);
                ctx.fill();
                // Stopka
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(egg.x - 3, egg.y - egg.radiusY - 6, 6, 6);
                // Oči lilku
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 4, 1.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 4, 1.2, 0, Math.PI*2); ctx.fill();
            }

            // Skóre
            ctx.fillStyle = "#00ffcc";
            ctx.font = "bold 22px 'Courier New'";
            ctx.fillText("SCORE: " + player.score, canvas.width / 2 - 60, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
