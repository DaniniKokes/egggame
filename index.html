<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - Doladěné detaily</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #444; 
            background: #87CEEB; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

      // ==========================================
        // SEKCE 1: BUDOVY, ULICE, LAMPY MIMO RAMPY A ZEBRY
        // ==========================================
        const buildingWidth = 220;
        const themeColor = "#111111";

        const rooms = [
            { id: 0, side: 'left',  y: 55 },
            { id: 1, side: 'left',  y: 275 },
            { id: 2, side: 'right', y: 55 },
            { id: 3, side: 'right', y: 275 }
        ];

        function drawCleanBrickBuilding(startX, width, side) {
            ctx.fillStyle = "#A52A2A";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            
            ctx.fillStyle = "#8B0000";
            for (let i = 0; i < canvas.height - 100; i += 25) {
                for (let j = 0; j < width - 20; j += 45) {
                    let brickX = side === 'left' ? startX + j : startX + 20 + j;
                    ctx.fillRect(brickX, i, 40, 20);
                }
            }

            ctx.fillStyle = "#A52A2A";
            if (side === 'left') {
                ctx.fillRect(startX + width - 20, 0, 20, canvas.height - 100);
            } else {
                ctx.fillRect(startX, 0, 20, canvas.height - 100);
            }
        }

        function drawEnvironment() {
            // 1. Pozadí ulice (tmavě šedý asfalt)
            ctx.fillStyle = "#2b2b2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Chodníky podél budov
            ctx.fillStyle = "#7c7c7c";
            ctx.fillRect(buildingWidth, 0, 30, canvas.height - 100); 
            ctx.fillRect(canvas.width - buildingWidth - 30, 0, 30, canvas.height - 100); 

            // 3. Budovy
            drawCleanBrickBuilding(0, buildingWidth, 'left');
            drawCleanBrickBuilding(canvas.width - buildingWidth, buildingWidth, 'right');

            // 4. Přechody pro chodce (zebry) přes celou silnici (nahoře a dole)
            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            
            // Horní zebra (mezi horními patry)
            let zebraTopY = 195;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraTopY, 14, 35);
            }

            // Dolní zebra (mezi dolními patry / kde stojí panáček)
            let zebraBottomY = 415;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraBottomY, 14, 35);
            }

            // 5. Žlutá přerušovaná čára uprostřed ulice
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height - 100);
            ctx.stroke();
            ctx.setLineDash([]); 

            // 6. Místnosti a rampy
            rooms.forEach(r => {
                if (r.side === 'left') {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(0, r.y - 15, buildingWidth - 20, 85);
                    
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(buildingWidth - 20, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 70);
                    ctx.lineTo(buildingWidth + 70, r.y + 130);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(canvas.width - buildingWidth + 20, r.y - 15, buildingWidth - 20, 85);

                    ctx.fillStyle = themeColor;
                    ctx.fillRect(canvas.width - buildingWidth, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 70);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 130);
                    ctx.stroke();
                }
            });

            // 7. Lampy veřejného osvětlení umístěné BEZPEČNĚ MIMO rampy (uprostřed mezi patry)
            const lampYPositions = [165, 385]; // Přesně v místech, kde žádné rampy nejsou

            lampYPositions.forEach(lampY => {
                // Žlutá záře lampy na levém chodníku
                ctx.fillStyle = "rgba(241, 196, 15, 0.25)";
                ctx.beginPath();
                ctx.arc(buildingWidth + 15, lampY, 45, 0, Math.PI * 2);
                ctx.arc(canvas.width - buildingWidth - 15, lampY, 45, 0, Math.PI * 2);
                ctx.fill();

                // Sloup lampy vlevo
                ctx.fillStyle = "#555";
                ctx.fillRect(buildingWidth + 12, lampY - 20, 6, 40);
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(buildingWidth + 15, lampY, 4, 0, Math.PI * 2);
                ctx.fill();

                // Sloup lampy vpravo
                ctx.fillStyle = "#555";
                ctx.fillRect(canvas.width - buildingWidth - 18, lampY - 20, 6, 40);
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(canvas.width - buildingWidth - 15, lampY, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // Spodní silnice/okraj
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // ==========================================
        // SEKCE 2: PANÁČEK A OVLÁDÁNÍ
        // ==========================================
        const playerImg = new Image();
        playerImg.src = "player.png";

        const positions = [
            { x: buildingWidth + 30, y: 200, roomIndex: 0 }, 
            { x: buildingWidth + 30, y: 420, roomIndex: 1 }, 
            { x: canvas.width - buildingWidth - 75, y: 200, roomIndex: 2 }, 
            { x: canvas.width - buildingWidth - 75, y: 420, roomIndex: 3 }  
        ];

        let currentPosIndex = 1;
        let animTimer = 0;
        let isMovingEffect = false;

        window.addEventListener("keydown", (e) => {
            let oldIndex = currentPosIndex;
            if (e.key === "ArrowUp") {
                if (currentPosIndex === 1) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                if (currentPosIndex === 2) currentPosIndex = 3;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                if (currentPosIndex === 1) currentPosIndex = 3;
            }

            if (oldIndex !== currentPosIndex) {
                isMovingEffect = true;
                animTimer = 10;
            }
        });

        function drawPlayer() {
            let targetPos = positions[currentPosIndex];
            let width = 45;
            let height = 65;
            let renderX = targetPos.x;
            let renderY = targetPos.y;

            if (isMovingEffect) {
                animTimer--;
                width += 6;
                height -= 6;
                renderY += 4;
                if (animTimer <= 0) isMovingEffect = false;
            }

            if (playerImg.complete) {
                ctx.drawImage(playerImg, renderX, renderY, width, height);
            }
        }

       // ==========================================
        // SEKCE 3: LILKY (S KUTÁLENÍM / ROTACÍ)
        // ==========================================
        const lilekImg = new Image();
        lilekImg.src = "lilek.png"; 

        let lilky = [];
        let spawnCounter = 0;

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];

            let isLeft = r.side === 'left';
            let startX = isLeft ? 30 : canvas.width - 30;
            let startY = r.y + 70; 

            lilky.push({
                roomIndex: rIdx,
                x: startX,
                y: startY,
                isLeft: isLeft,
                speed: 1.1,
                state: 'room',
                angle: 0 // Úhel rotace pro kutálení
            });
        }

        function updateAndDrawLilky() {
            spawnCounter++;
            if (spawnCounter > 150) { 
                spawnLilek();
                spawnCounter = 0;
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (l.state === 'room') {
                    let windowX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);

                    if (l.isLeft) {
                        l.x += l.speed;
                        l.y = r.y + 70;
                        l.angle += 0.05; // Točí se při chůzi v místnosti
                        if (l.x >= windowX) {
                            l.state = 'ramp';
                        }
                    } else {
                        l.x -= l.speed;
                        l.y = r.y + 70;
                        l.angle -= 0.05;
                        if (l.x <= windowX) {
                            l.state = 'ramp';
                        }
                    }
                } 
                else if (l.state === 'ramp') {
                    if (l.isLeft) {
                        l.x += l.speed;
                        let rampStartX = buildingWidth;
                        let rampStartY = r.y + 70;
                        let progress = (l.x - rampStartX) / 70; 
                        l.y = rampStartY + (progress * 60) - 6; 
                        l.angle += 0.08; // Rychlejší kutálení na rampě
                    } else {
                        l.x -= l.speed;
                        let rampStartX = canvas.width - buildingWidth;
                        let rampStartY = r.y + 70;
                        let progress = (rampStartX - l.x) / 70;
                        l.y = rampStartY + (progress * 60) - 6;
                        l.angle -= 0.08;
                    }
                }

                // Vykreslení lilku s rotací (kutálení)
                ctx.save();
                ctx.translate(l.x, l.y - 10); // Posuneme střed otáčení na pozici lilku
                ctx.rotate(l.angle);        // Otočíme o aktuální úhel

                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -15, -15, 30, 30); // Kreslíme centrovaně vůči středu otáčení
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore(); // Vrátíme plátno do původního stavu pro zbytek hry

                // Kontrola chycení panáčkem
                let targetPos = positions[l.roomIndex];
                let catchAreaX = targetPos.x + 15;
                let catchAreaY = targetPos.y + 20;

                let distance = Math.hypot(l.x - catchAreaX, l.y - catchAreaY);
                if (distance < 30) {
                    lilky.splice(i, 1); 
                } 
                else if ((l.isLeft && l.x > buildingWidth + 75) || (!l.isLeft && l.x < canvas.width - buildingWidth - 75)) {
                    lilky.splice(i, 1); 
                }
            }
        }

        // ==========================================
        // HLAVNÍ HERNÍ SMYČKA
        // ==========================================
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment(); 
            updateAndDrawLilky();
            drawPlayer();      

            requestAnimationFrame(gameLoop);
        }

        playerImg.onload = () => {
            gameLoop();
        };
        if(playerImg.complete) {
            gameLoop();
        }
    </script>
</body>
</html>
