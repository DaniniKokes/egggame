<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Egg & Lilek - PSG1 Deluxe Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #09090c; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #1a1a24; 
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            background: #1f1f2e; 
            cursor: pointer;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script> 
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let isConnected = false;
        let playTokenBalance = 500; 
        let freeTrialMode = false;
        const FREE_TRIAL_LIMIT = 50;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusicInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                osc.frequency.setValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'shop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(950, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function startBackgroundMusic() {
            if (backgroundMusicInterval) return;
            const notes = [220, 277, 330, 440, 554, 330, 277];
            let index = 0;
            backgroundMusicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[index], now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                index = (index + 1) % notes.length;
            }, 200);
        }

        let gameStarted = false;

        const bgImg = new Image();
        bgImg.src = "hlavni stranka.png";

        const playerLeftImg = new Image();
        playerLeftImg.src = "player.png l.png";

        const playerRightImg = new Image();
        playerRightImg.src = "player.png r.png";

        const playerCenterImg = new Image();
        playerCenterImg.src = "player1.png";

        const lilekImg = new Image();
        lilekImg.src = "lilek.png";

        const positions = [
            { x: 300, y: 350, side: 'left' },   // 0: Levé horní patro
            { x: 300, y: 480, side: 'left' },   // 1: Levé dolní patro
            { x: 600, y: 350, side: 'right' },  // 2: Pravé horní patro
            { x: 600, y: 480, side: 'right' },  // 3: Pravé dolní patro
            { x: 450, y: 565, side: 'center' }  // 4: Dole na silnici
        ];

        const rooms = [
            { id: 0, side: 'left',  y: 245, startX: 80, endX: 300 },  
            { id: 1, side: 'left',  y: 380, startX: 80, endX: 300 },  
            { id: 2, side: 'right', y: 245, startX: 820, endX: 600 },  
            { id: 3, side: 'right', y: 380, startX: 820, endX: 600 }   
        ];

        let currentPosIndex = 4; 
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = false;
        let isShopOpen = false;
        let shopTriggered = false; 
        let unlockedBoxes = { box1: true, box2: false, box3: false };
        let activeBox = 1; 
        let txPending = false;
        let txMessage = "";
        let catchAnimFrames = 0; 
        let baseSpeed = 0.7; 
        let animTimer = 0;

        // --- GAMEPAD / OVLADAČ & PÁČKY LOGIKA ---
        let prevGamepadState = { buttons: {}, axes: {} };

        function handleGamepadInput() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (!gamepads[0]) return;
            const gp = gamepads[0];

            // Detekce tlačítek s ošetřením proti rychlému držení (debounce)
            const buttonPressed = (index) => {
                let pressed = gp.buttons[index] && gp.buttons[index].pressed;
                let wasPressed = prevGamepadState.buttons[index] || false;
                prevGamepadState.buttons[index] = pressed;
                return pressed && !wasPressed; // Vrátí true jen při prvním stisknutí
            };

            const anyPressed = (index) => gp.buttons[index] && gp.buttons[index].pressed;

            startBackgroundMusic();

            // Sledování analogových páček nebo D-padu
            let axisX = gp.axes[0] || 0; // Levá páčka vodorovně (-1 vlevo, 1 vpravo)
            let axisY = gp.axes[1] || 0; // Levá páčka svisle (-1 nahoru, 1 dole)

            // D-pad (směrová tlačítka na ovladači obvykle na indexech 12-15)
            let dpadUp = gp.buttons[12] && gp.buttons[12].pressed;
            let dpadDown = gp.buttons[13] && gp.buttons[13].pressed;
            let dpadLeft = gp.buttons[14] && gp.buttons[14].pressed;
            let dpadRight = gp.buttons[15] && gp.buttons[15].pressed;

            // Logika pohybu postavičky s prahem pro páčky (deadzone 0.5)
            if (!isPaused && !isGameOver && !isShopOpen && gameStarted) {
                // Pohyb nahoru (Páčka nahoru nebo D-pad Up s detekcí změny)
                if ((axisY < -0.5 || dpadUp) && !prevGamepadState.movedY) {
                    if (currentPosIndex === 4) currentPosIndex = 1;
                    else if (currentPosIndex === 1) currentPosIndex = 0;
                    else if (currentPosIndex === 3) currentPosIndex = 2;
                    prevGamepadState.movedY = true;
                } else if (axisY >= -0.5 && axisY <= 0.5 && !dpadUp && !dpadDown) {
                    prevGamepadState.movedY = false;
                }

                // Pohyb dolů
                if ((axisY > 0.5 || dpadDown) && !prevGamepadState.movedYDown) {
                    if (currentPosIndex === 0) currentPosIndex = 1;
                    else if (currentPosIndex === 2) currentPosIndex = 3;
                    else if (currentPosIndex === 1 || currentPosIndex === 3) currentPosIndex = 4;
                    prevGamepadState.movedYDown = true;
                } else if (axisY >= -0.5 && axisY <= 0.5 && !dpadDown) {
                    prevGamepadState.movedYDown = false;
                }

                // Pohyb doleva
                if ((axisX < -0.5 || dpadLeft) && !prevGamepadState.movedX) {
                    if (currentPosIndex === 2) currentPosIndex = 0;
                    else if (currentPosIndex === 3) currentPosIndex = 1;
                    else if (currentPosIndex === 4) currentPosIndex = 1;
                    prevGamepadState.movedX = true;
                } else if (axisX >= -0.5 && axisX <= 0.5 && !dpadLeft && !dpadRight) {
                    prevGamepadState.movedX = false;
                }

                // Pohyb doprava
                if ((axisX > 0.5 || dpadRight) && !prevGamepadState.movedXRight) {
                    if (currentPosIndex === 0) currentPosIndex = 2;
                    else if (currentPosIndex === 1) currentPosIndex = 3;
                    else if (currentPosIndex === 4) currentPosIndex = 3;
                    prevGamepadState.movedXRight = true;
                } else if (axisX >= -0.5 && axisX <= 0.5 && !dpadRight) {
                    prevGamepadState.movedXRight = false;
                }
            }

            // Tlačítko START / Akce (Button 0 = obvykle spodní tlačítko 'A' / 'X' nebo Button 9 = Start)
            if (buttonPressed(0) || buttonPressed(9)) {
                if (!gameStarted) {
                    isConnected = true; freeTrialMode = true; gameStarted = true; playSound('shop');
                } else if (isGameOver) {
                    restartGame();
                } else if (isShopOpen && !txPending) {
                    isShopOpen = false;
                }
            }

            // Tlačítko PAUZA (Button 3 = horní/trojúhelník nebo Button 8 = Select)
            if (buttonPressed(3) || buttonPressed(8)) {
                if (gameStarted && !isGameOver) {
                    isPaused = !isPaused;
                    playSound('shop');
                }
            }
        }

        function drawEnvironment() {
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#12121a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            ctx.fillStyle = "rgba(40, 40, 55, 0.7)";
            ctx.strokeStyle = "#555";
            ctx.lineWidth = 2;

            ctx.fillRect(260, 350, 80, 10); ctx.strokeRect(260, 350, 80, 10);
            ctx.fillRect(260, 480, 80, 10); ctx.strokeRect(260, 480, 80, 10);

            ctx.fillRect(560, 350, 80, 10); ctx.strokeRect(560, 350, 80, 10);
            ctx.fillRect(560, 480, 80, 10); ctx.strokeRect(560, 480, 80, 10);
        }

        function drawTopBoxes() {
            let startX = canvas.width / 2 - 165;
            let boxWidth = 100;
            let boxHeight = 45;
            let y = 15;
            const boxesData = [
                { id: 1, name: "100 EGG", unlocked: true },
                { id: 2, name: "250 EGG", unlocked: unlockedBoxes.box2 },
                { id: 3, name: "500 EGG", unlocked: unlockedBoxes.box3 }
            ];
            boxesData.forEach((b, index) => {
                let x = startX + (index * 115);
                ctx.fillStyle = activeBox === b.id ? "#3498db" : (b.unlocked ? "#9b59b6" : "#2c2c38");
                ctx.fillRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.fillStyle = activeBox === b.id ? "#5dade2" : (b.unlocked ? "#af7ac5" : "#3b3b4f");
                ctx.fillRect(x - 4, y, boxWidth + 8, 12);
                ctx.strokeStyle = b.unlocked ? "#f1c40f" : "#444";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.strokeRect(x - 4, y, boxWidth + 8, 12);
                ctx.fillStyle = b.unlocked ? "#ffffff" : "#777";
                ctx.font = "bold 12px 'Courier New', Courier, monospace";
                ctx.fillText(b.name, x + 12, y + 32);
            });
        }

        // Ovládání klávesnicí (záložní možnost)
        window.addEventListener("keydown", (e) => {
            startBackgroundMusic();
            if (!gameStarted) return;
            if (isGameOver) {
                if (e.key === "Enter" || e.code === "Space") restartGame();
                return;
            }
            if (isShopOpen) {
                if (!txPending && (e.key === "Escape" || e.key === "Enter")) isShopOpen = false;
                return;
            }
            if (e.code === "Space") {
                isPaused = !isPaused;
                playSound('shop');
                return;
            }
            if (isPaused) return;

            if (e.key === "ArrowUp") {
                if (currentPosIndex === 4) currentPosIndex = 1;
                else if (currentPosIndex === 1) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                else if (currentPosIndex === 2) currentPosIndex = 3;
                else if (currentPosIndex === 1 || currentPosIndex === 3) currentPosIndex = 4;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 1;
                else if (currentPosIndex === 4) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                else if (currentPosIndex === 1) currentPosIndex = 3;
                else if (currentPosIndex === 4) currentPosIndex = 3;
            }
        });

        window.addEventListener("click", (e) => {
            startBackgroundMusic();
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (!gameStarted) {
                if (mouseX >= canvas.width / 2 - 240 && mouseX <= canvas.width / 2 - 20 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    isConnected = true; freeTrialMode = false; gameStarted = true; playSound('shop'); return;
                }
                if (mouseX >= canvas.width / 2 + 20 && mouseX <= canvas.width / 2 + 240 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    freeTrialMode = true; gameStarted = true; playSound('shop'); return;
                }
                return;
            }
        });

        function drawPlayerWithBasket() {
            let targetPos = positions[currentPosIndex];
            let width = 72;
            let height = 100;
            
            animTimer += 0.1;
            let bounce = Math.sin(animTimer) * 2;
            let shake = catchAnimFrames > 0 ? (Math.random() * 6 - 3) : 0;
            if (catchAnimFrames > 0) catchAnimFrames--;

            let renderX = targetPos.x - width / 2 + shake;
            let renderY = targetPos.y - height + bounce;

            ctx.save();
            
            let imgToDraw = playerCenterImg;
            if (targetPos.side === 'left') imgToDraw = playerLeftImg;
            else if (targetPos.side === 'right') imgToDraw = playerRightImg;

            if (imgToDraw.complete && imgToDraw.naturalWidth !== 0) {
                ctx.drawImage(imgToDraw, renderX, renderY, width, height);
            } else {
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(renderX, renderY, width, height);
            }
            ctx.restore();
        }

        let lilky = [];
        let spawningLilky = []; 
        let spawnCounter = 0;

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];
            
            let currentCycleScore = score % 100;
            let dynamicSpeed = 0.7 + (currentCycleScore * 0.015);

            lilky.push({
                roomIndex: rIdx, x: r.startX, y: r.y - 10, isLeft: r.side === 'left',
                speed: dynamicSpeed, state: 'walking', angle: 0, counted: false
            });
        }

        function updateAndDrawLilky() {
            if (!isPaused && !isGameOver && !isShopOpen) {
                spawnCounter++;
                let currentSpawnInterval = Math.max(70, 150 - (score * 2));
                if (spawnCounter > currentSpawnInterval) { 
                    spawnLilek();
                    spawnCounter = 0;
                }
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (!isPaused && !isGameOver && !isShopOpen) {
                    if (l.state === 'walking') {
                        l.x += l.isLeft ? l.speed : -l.speed;
                        l.y = r.y - 10; 
                        l.angle += l.isLeft ? 0.04 : -0.04;
                        
                        if ((l.isLeft && l.x >= r.endX) || (!l.isLeft && l.x <= r.endX)) {
                            l.state = 'at_balcony';
                        }
                    } else if (l.state === 'at_balcony') {
                        if (currentPosIndex === l.roomIndex) {
                            playSound('catch'); 
                            catchAnimFrames = 12; 
                            
                            spawningLilky.push({
                                x: positions[currentPosIndex].x,
                                y: positions[currentPosIndex].y - 30,
                                targetY: positions[currentPosIndex].y + 10,
                                progress: 0
                            });

                            lilky.splice(i, 1); 
                            score++;
                            
                            let currentCycleScore = score % 100;
                            baseSpeed = 0.7 + (currentCycleScore * 0.015); 

                            if (freeTrialMode && score >= FREE_TRIAL_LIMIT) {
                                isGameOver = true; playSound('gameover');
                            }
                            if (score >= 100 && !shopTriggered) {
                                shopTriggered = true; isShopOpen = true; playSound('shop');
                            }
                            continue;
                        } else {
                            l.state = 'falling';
                        }
                    } else if (l.state === 'falling') {
                        l.y += 6; 
                        l.angle += 0.1;
                        let groundY = canvas.height - 15; 
                        if (l.y >= groundY) {
                            l.y = groundY;
                            l.state = 'ground';
                            if (!l.counted) {
                                playSound('drop'); 
                                lives--;
                                l.counted = true;
                                if (lives <= 0) { playSound('gameover'); isGameOver = true; }
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.rotate(l.angle);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -14, -14, 28, 28);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                if (!isPaused && l.state === 'ground' && Math.random() < 0.03) {
                    lilky.splice(i, 1);
                }
            }

            for (let i = spawningLilky.length - 1; i >= 0; i--) {
                let sl = spawningLilky[i];
                if (!isPaused && !isGameOver && !isShopOpen) {
                    sl.progress += 0.15;
                    sl.y += 3; 
                    if (sl.progress >= 1) {
                        spawningLilky.splice(i, 1);
                        continue;
                    }
                }
                ctx.save();
                ctx.translate(sl.x, sl.y);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -14, -14, 28, 28);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
            }
        }

        function drawStartScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 36px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("EGG & EGGPLANT", canvas.width / 2, canvas.height / 2 - 110);
            ctx.fillStyle = "#3498db"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText("PSG1 DELUXE EDITION", canvas.width / 2, canvas.height / 2 - 70);

            // Nápověda ovládání na úvodní obrazovce
            ctx.fillStyle = "#2ecc71"; ctx.fillRect(canvas.width / 2 - 240, canvas.height / 2 - 20, 220, 60);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 240, canvas.height / 2 - 20, 220, 60);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillText("CONNECT WALLET", canvas.width / 2 - 130, canvas.height / 2 + 7);

            ctx.fillStyle = "#9b59b6"; ctx.fillRect(canvas.width / 2 + 20, canvas.height / 2 - 20, 220, 60);
            ctx.strokeRect(canvas.width / 2 + 20, canvas.height / 2 - 20, 220, 60);
            ctx.fillStyle = "#ffffff";
            ctx.fillText("FREE TRIAL", canvas.width / 2 + 130, canvas.height / 2 + 7);

            // Jasná nápověda pro tlačítka konzole
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("🎮 OVLÁDÁNÍ: Křížek / Páčky = Pohyb", canvas.width / 2, canvas.height / 2 + 80);
            ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte tlačítko [A / Spodní] pro START / VÝBĚR", canvas.width / 2, canvas.height / 2 + 110);
            ctx.fillText("Stiskněte tlačítko [Start / Select] pro PAUZU", canvas.width / 2, canvas.height / 2 + 135);

            ctx.textAlign = "start";
        }

        function drawUI() {
            ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(15, 15, 130, 45, 8); ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = "#3498db"; ctx.fillText("SCORE", 25, 33);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText(score, 25, 52);

            drawTopBoxes();

            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(canvas.width - 175, 15, 160, 45, 8); ctx.fill();
            ctx.strokeStyle = freeTrialMode ? "#9b59b6" : "#2ecc71"; ctx.stroke();
            ctx.fillStyle = freeTrialMode ? "#9b59b6" : "#2ecc71"; ctx.font = "bold 13px 'Courier New', Courier, monospace";
            if (freeTrialMode) {
                ctx.fillText("🎮 FREE TRIAL", canvas.width - 165, 33);
                ctx.fillStyle = "#aaa"; ctx.font = "11px 'Courier New', Courier, monospace";
                ctx.fillText("Goal: " + score + "/50", canvas.width - 165, 50);
            } else {
                ctx.fillText("💰 " + playTokenBalance + " PLAY", canvas.width - 165, 33);
            }

            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("Životy: " + "❤️".repeat(lives), 15, 85);

            // Malá nápověda pro pauzu nahoře
            ctx.fillStyle = "#aaa"; ctx.font = "11px 'Courier New', Courier, monospace";
            ctx.fillText("Pauza: Horní tlačítko / Select", 15, 110);
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("PAUZA", canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte tlačítko PAUZA pro pokračování", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText(freeTrialMode && score >= FREE_TRIAL_LIMIT ? "TRIAL DOKONČEN!" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = "#ffffff"; ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Chyceno lilek: " + score, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillStyle = "#f1c40f"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte tlačítko [A] pro restart", canvas.width / 2, canvas.height / 2 + 70);
            ctx.textAlign = "start";
        }

        function restartGame() {
            gameStarted = false; freeTrialMode = false;
            score = 0; lives = 3; baseSpeed = 0.7; lilky = []; spawningLilky = []; spawnCounter = 0;
            isGameOver = false; isPaused = false; isShopOpen = false; shopTriggered = false;
            unlockedBoxes = { box1: true, box2: false, box3: false }; activeBox = 1;
            currentPosIndex = 4;
        }

        function gameLoop() {
            // Každý snímek zkontrolujeme fyzický ovladač
            handleGamepadInput();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(); 
            
            if (!gameStarted) { drawStartScreen(); requestAnimationFrame(gameLoop); return; }
            if (isGameOver) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawGameOver(); requestAnimationFrame(gameLoop); return; }
            if (isShopOpen) { requestAnimationFrame(gameLoop); return; }
            if (isPaused) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawPauseScreen(); requestAnimationFrame(gameLoop); return; }

            updateAndDrawLilky();
            drawPlayerWithBasket();      
            drawUI();
            requestAnimationFrame(gameLoop);
        }

        bgImg.onload = () => { gameLoop(); };
        if(bgImg.complete) { gameLoop(); }
    </script>
</body>
</html>
