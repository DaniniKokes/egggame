<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - PSG1 Deluxe Edition (Full Version)</title>
    <style>
        body { 
            margin: 0; 
            background: #09090c; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #1a1a24; 
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            background: #1f1f2e; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let isConnected = false;
        let walletAddress = "";
        let playTokenBalance = 500; 
        let freeTrialMode = false;
        const FREE_TRIAL_LIMIT = 50;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusicInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                osc.frequency.setValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'shop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(950, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function startBackgroundMusic() {
            if (backgroundMusicInterval) return;
            const notes = [220, 277, 330, 440, 554, 330, 277];
            let index = 0;
            backgroundMusicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[index], now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                index = (index + 1) % notes.length;
            }, 200);
        }

        let gameStarted = false;
        const buildingWidth = 220;

        const rooms = [
            { id: 0, side: 'left',  y: 55 },
            { id: 1, side: 'left',  y: 275 },
            { id: 2, side: 'right', y: 55 },
            { id: 3, side: 'right', y: 275 }
        ];

        let isShopOpen = false;
        let shopTriggered = false; 
        let unlockedBoxes = { box1: true, box2: false, box3: false };
        let activeBox = 1; 
        let familySupported = false; 
        let txPending = false;
        let txMessage = "";
        let catchAnimFrames = 0; 

        function drawDetailedBuilding(startX, width, side) {
            ctx.fillStyle = "#8E2828";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            ctx.fillStyle = "#6B1D1D";
            for (let i = 0; i < canvas.height - 100; i += 22) {
                let offset = (i / 22) % 2 === 0 ? 0 : 22;
                for (let j = 0; j < width; j += 44) {
                    let brickX = startX + j + (side === 'left' ? offset : -offset);
                    ctx.fillRect(brickX, i, 40, 18);
                }
            }
            ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
            if (side === 'left') {
                ctx.fillRect(startX + width - 15, 0, 15, canvas.height - 100);
            } else {
                ctx.fillRect(startX, 0, 15, canvas.height - 100);
            }
        }

        function drawEnvironment() {
            ctx.fillStyle = "#12121a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#4a4a5e";
            ctx.fillRect(buildingWidth, 0, 30, canvas.height - 100); 
            ctx.fillRect(canvas.width - buildingWidth - 30, 0, 30, canvas.height - 100); 

            drawDetailedBuilding(0, buildingWidth, 'left');
            drawDetailedBuilding(canvas.width - buildingWidth, buildingWidth, 'right');

            let shopUnlocked = score >= 100;
            ctx.fillStyle = "#0a0a0f";
            ctx.fillRect(canvas.width - buildingWidth + 40, canvas.height - 180, 80, 80);
            ctx.strokeStyle = shopUnlocked ? "#2ecc71" : "#444";
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width - buildingWidth + 40, canvas.height - 180, 80, 80);

            ctx.fillStyle = shopUnlocked ? "#2ecc71" : "#666";
            ctx.font = "bold 13px 'Courier New', Courier, monospace";
            ctx.fillText("SHOP", canvas.width - buildingWidth + 60, canvas.height - 135);

            ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, 195, 14, 35);
                ctx.fillRect(x, 415, 14, 35);
            }

            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height - 100);
            ctx.stroke();
            ctx.setLineDash([]); 

            rooms.forEach(r => {
                if (r.side === 'left') {
                    ctx.fillStyle = "#d3832c";
                    ctx.fillRect(0, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = "#1c1c28";
                    ctx.fillRect(buildingWidth - 20, r.y + 20, 20, 50);
                    ctx.fillStyle = "#ffeaa7";
                    ctx.fillRect(buildingWidth - 15, r.y + 25, 12, 40);

                    ctx.strokeStyle = "#2c2c38";
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 70);
                    ctx.lineTo(buildingWidth + 70, r.y + 130);
                    ctx.stroke();
                    ctx.strokeStyle = "#d3832c";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 70);
                    ctx.lineTo(buildingWidth + 70, r.y + 130);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#d3832c";
                    ctx.fillRect(canvas.width - buildingWidth + 20, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = "#1c1c28";
                    ctx.fillRect(canvas.width - buildingWidth, r.y + 20, 20, 50);
                    ctx.fillStyle = "#ffeaa7";
                    ctx.fillRect(canvas.width - buildingWidth + 3, r.y + 25, 12, 40);

                    ctx.strokeStyle = "#2c2c38";
                    ctx.lineWidth = 8;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 70);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 130);
                    ctx.stroke();
                    ctx.strokeStyle = "#d3832c";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 70);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 130);
                    ctx.stroke();
                }
            });

            ctx.fillStyle = "#181822";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }function drawTopBoxes() {
            let startX = canvas.width / 2 - 165;
            let boxWidth = 100;
            let boxHeight = 45;
            let y = 15;
            const boxesData = [
                { id: 1, name: "100 EGG", unlocked: true },
                { id: 2, name: "250 EGG", unlocked: unlockedBoxes.box2 },
                { id: 3, name: "500 EGG", unlocked: unlockedBoxes.box3 }
            ];
            boxesData.forEach((b, index) => {
                let x = startX + (index * 115);
                ctx.fillStyle = activeBox === b.id ? "#3498db" : (b.unlocked ? "#9b59b6" : "#2c2c38");
                ctx.fillRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.fillStyle = activeBox === b.id ? "#5dade2" : (b.unlocked ? "#af7ac5" : "#3b3b4f");
                ctx.fillRect(x - 4, y, boxWidth + 8, 12);
                ctx.strokeStyle = b.unlocked ? "#f1c40f" : "#444";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.strokeRect(x - 4, y, boxWidth + 8, 12);
                ctx.fillStyle = b.unlocked ? "#ffffff" : "#777";
                ctx.font = "bold 12px 'Courier New', Courier, monospace";
                ctx.fillText(b.name, x + 12, y + 32);
            });
        }

        const playerImg = new Image();
        playerImg.src = "player.png";

        const positions = [
            { x: buildingWidth + 15, y: 145, roomIndex: 0, side: 'left' },  
            { x: buildingWidth + 15, y: 365, roomIndex: 1, side: 'left' },  
            { x: canvas.width - buildingWidth - 60, y: 145, roomIndex: 2, side: 'right' }, 
            { x: canvas.width - buildingWidth - 60, y: 365, roomIndex: 3, side: 'right' }  
        ];

        let currentPosIndex = 1;
        let animTimer = 0;
        let isMovingEffect = false;
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = false;
        let idleBreathTimer = 0;

        window.addEventListener("keydown", (e) => {
            startBackgroundMusic();
            if (!gameStarted) return;
            if (isGameOver) {
                if (e.key === "Enter" || e.code === "Space") restartGame();
                return;
            }
            if (isShopOpen) {
                if (!txPending && (e.key === "Escape" || e.key === "Enter")) isShopOpen = false;
                return;
            }
            if (e.code === "Space") {
                isPaused = !isPaused;
                playSound('shop');
                return;
            }
            if (isPaused) return;

            let oldIndex = currentPosIndex;
            if (e.key === "ArrowUp") {
                if (currentPosIndex === 1) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                if (currentPosIndex === 2) currentPosIndex = 3;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                if (currentPosIndex === 1) currentPosIndex = 3;
            }
            if (oldIndex !== currentPosIndex) {
                isMovingEffect = true;
                animTimer = 12;
            }
        });

        window.addEventListener("click", (e) => {
            startBackgroundMusic();
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (!gameStarted) {
                if (mouseX >= canvas.width / 2 - 240 && mouseX <= canvas.width / 2 - 20 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    isConnected = true; walletAddress = "PSG1...9xK4"; freeTrialMode = false; gameStarted = true; playSound('shop'); return;
                }
                if (mouseX >= canvas.width / 2 + 20 && mouseX <= canvas.width / 2 + 240 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    freeTrialMode = true; gameStarted = true; playSound('shop'); return;
                }
                return;
            }

            if (!isConnected && !freeTrialMode && mouseX >= canvas.width - 165 && mouseX <= canvas.width - 15 && mouseY >= 15 && mouseY <= 60) {
                isConnected = true; walletAddress = "PSG1...9xK4"; playSound('shop'); return;
            }

            if (isShopOpen && !txPending) {
                if (mouseX >= canvas.width / 2 - 270 && mouseX <= canvas.width / 2 - 120 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box2) buyBox('box2', 50, 2); else activeBox = 2;
                }
                if (mouseX >= canvas.width / 2 + 110 && mouseX <= canvas.width / 2 + 270 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box3) buyBox('box3', 100, 3); else activeBox = 3;
                }
            }
        });

        function buyBox(boxKey, price, boxId) {
            if (playTokenBalance < price) {
                txMessage = "Insufficient PLAY tokens in wallet!";
                setTimeout(() => { txMessage = ""; }, 2500);
                return;
            }
            txPending = true;
            txMessage = "Processing transaction...";
            setTimeout(() => {
                playTokenBalance -= price;
                unlockedBoxes[boxKey] = true;
                activeBox = boxId;
                if(boxId === 3) familySupported = true;
                txPending = false;
                txMessage = "Successfully unlocked & equipped box! ❤️";
                playSound('shop');
                setTimeout(() => { txMessage = ""; }, 3000);
            }, 1500);
        }

        function drawPlayerWithBasket() {
            let targetPos = positions[currentPosIndex];
            let width = 45;
            let height = 65;
            let renderX = targetPos.x;
            let renderY = targetPos.y;

            idleBreathTimer += 0.08;
            renderY += Math.sin(idleBreathTimer) * 2;

            if (isMovingEffect) {
                animTimer--;
                let bounce = Math.sin(animTimer * 0.8) * 6;
                width += bounce; height -= bounce; renderY -= bounce / 2;
                if (animTimer <= 0) isMovingEffect = false;
            }

            ctx.save();
            if (targetPos.side === 'right') {
                ctx.translate(renderX + width / 2, renderY + height / 2);
                ctx.scale(-1, 1);
                ctx.translate(-(renderX + width / 2), -(renderY + height / 2));
            }

            if (playerImg.complete) {
                ctx.drawImage(playerImg, renderX, renderY, width, height);
            }
            ctx.restore();

            if (catchAnimFrames > 0) catchAnimFrames--;
            let basketBounce = catchAnimFrames > 0 ? -6 : 0;

            let basketX = targetPos.side === 'left' ? renderX + 35 : renderX - 22;
            let basketY = renderY + 28 + basketBounce;

            if (activeBox === 1) {
                ctx.fillStyle = "#8e44ad";
                ctx.fillRect(basketX, basketY, 32, 22);
                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 2;
                ctx.strokeRect(basketX, basketY, 32, 22);
                ctx.fillStyle = "#512e5f";
                ctx.fillRect(basketX + 4, basketY + 4, 8, 14);
                ctx.fillRect(basketX + 20, basketY + 4, 8, 14);
            } else if (activeBox === 2) {
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(basketX - 2, basketY - 2, 36, 25);
                ctx.strokeStyle = "#f39c12"; ctx.lineWidth = 3;
                ctx.strokeRect(basketX - 2, basketY - 2, 36, 25);
                ctx.fillStyle = "#2ecc71";
                ctx.fillRect(basketX + 4, basketY + 4, 24, 6);
            } else if (activeBox === 3) {
                ctx.fillStyle = "#c0392b";
                ctx.fillRect(basketX - 4, basketY - 4, 40, 28);
                ctx.strokeStyle = "#f1c40f"; ctx.lineWidth = 3;
                ctx.strokeRect(basketX - 4, basketY - 4, 40, 28);
                ctx.fillStyle = "#f1c40f";
                ctx.font = "10px sans-serif";
                ctx.fillText("⭐", basketX + 12, basketY + 14);
            }
        }const lilekImg = new Image();
        lilekImg.src = "lilek.png"; 

        let lilky = [];
        let spawnCounter = 0;
        let baseSpeed = 0.5; 

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];
            let isLeft = r.side === 'left';
            let startX = isLeft ? 30 : canvas.width - 30;
            let startY = r.y + 70; 

            lilky.push({
                roomIndex: rIdx, x: startX, y: startY, isLeft: isLeft,
                speed: baseSpeed, state: 'room', angle: 0, counted: false
            });
        }

        function updateAndDrawLilky() {
            if (!isPaused && !isGameOver && !isShopOpen) {
                spawnCounter++;
                let currentSpawnInterval = Math.max(90, 180 - (score * 2));
                if (spawnCounter > currentSpawnInterval) { 
                    spawnLilek();
                    spawnCounter = 0;
                }
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (!isPaused && !isGameOver && !isShopOpen) {
                    if (l.state === 'room') {
                        let windowX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                        l.x += l.isLeft ? l.speed : -l.speed;
                        l.y = r.y + 70;
                        l.angle += l.isLeft ? 0.04 : -0.04;
                        if ((l.isLeft && l.x >= windowX) || (!l.isLeft && l.x <= windowX)) {
                            l.state = 'ramp';
                        }
                    } else if (l.state === 'ramp') {
                        let rampStartX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                        let rampStartY = r.y + 70;

                        l.x += l.isLeft ? l.speed : -l.speed;
                        let progress = l.isLeft ? (l.x - rampStartX) / 70 : (rampStartX - l.x) / 70;
                        l.y = rampStartY + (progress * 60) - 6;
                        l.angle += l.isLeft ? 0.06 : -0.06;

                        let targetPos = positions[l.roomIndex];
                        let catchAreaX = targetPos.side === 'left' ? targetPos.x + 50 : targetPos.x - 5;
                        let catchAreaY = targetPos.y + 40;
                        let distance = Math.hypot(l.x - catchAreaX, l.y - catchAreaY);

                        if (distance < 35 && currentPosIndex === l.roomIndex) {
                            playSound('catch'); 
                            catchAnimFrames = 8; 
                            lilky.splice(i, 1); 
                            score++;
                            baseSpeed = 0.5 + (score * 0.01); 

                            if (freeTrialMode && score >= FREE_TRIAL_LIMIT) {
                                isGameOver = true; playSound('gameover');
                            }
                            if (score >= 100 && !shopTriggered) {
                                shopTriggered = true; isShopOpen = true; playSound('shop');
                            }
                            continue;
                        }

                        let rampEndX = l.isLeft ? (buildingWidth + 70) : (canvas.width - buildingWidth - 70);
                        if ((l.isLeft && l.x >= rampEndX) || (!l.isLeft && l.x < rampEndX)) {
                            l.state = 'falling';
                        }
                    } else if (l.state === 'falling') {
                        l.y += 4; l.angle += 0.1;
                        let groundY = canvas.height - 120;
                        if (l.y >= groundY) {
                            l.y = groundY;
                            l.state = 'ground';
                            if (!l.counted) {
                                playSound('drop'); 
                                lives--;
                                l.counted = true;
                                if (lives <= 0) { playSound('gameover'); isGameOver = true; }
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(l.x, l.y - 10);
                ctx.rotate(l.angle);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -15, -15, 30, 30);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                if (!isPaused && l.state === 'ground' && Math.random() < 0.03) {
                    lilky.splice(i, 1);
                }
            }
        }

        function drawStartScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 36px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("EGG & EGGPLANT", canvas.width / 2, canvas.height / 2 - 90);
            ctx.fillStyle = "#3498db"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText("PSG1 DELUXE EDITION", canvas.width / 2, canvas.height / 2 - 50);

            ctx.fillStyle = "#2ecc71"; ctx.fillRect(canvas.width / 2 - 240, canvas.height / 2 + 20, 220, 60);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 240, canvas.height / 2 + 20, 220, 60);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillText("CONNECT WALLET", canvas.width / 2 - 130, canvas.height / 2 + 47);

            ctx.fillStyle = "#9b59b6"; ctx.fillRect(canvas.width / 2 + 20, canvas.height / 2 + 20, 220, 60);
            ctx.strokeRect(canvas.width / 2 + 20, canvas.height / 2 + 20, 220, 60);
            ctx.fillStyle = "#ffffff";
            ctx.fillText("FREE TRIAL", canvas.width / 2 + 130, canvas.height / 2 + 47);
            ctx.textAlign = "start";
        }

        function drawUI() {
            ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(15, 15, 130, 45, 8); ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = "#3498db"; ctx.fillText("SCORE", 25, 33);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText(score, 25, 52);

            drawTopBoxes();

            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(canvas.width - 175, 15, 160, 45, 8); ctx.fill();
            ctx.strokeStyle = isConnected ? "#2ecc71" : "#9b59b6"; ctx.stroke();
            ctx.fillStyle = isConnected ? "#2ecc71" : "#9b59b6"; ctx.font = "bold 13px 'Courier New', Courier, monospace";
            if (!isConnected && !freeTrialMode) {
                ctx.fillText("CONNECT WALLET", canvas.width - 165, 42);
            } else if (freeTrialMode) {
                ctx.fillText("🎮 FREE TRIAL", canvas.width - 165, 33);
                ctx.fillStyle = "#aaa"; ctx.font = "11px 'Courier New', Courier, monospace";
                ctx.fillText("Goal: " + score + "/50", canvas.width - 165, 50);
            } else {
                ctx.fillText("💰 " + playTokenBalance + " PLAY", canvas.width - 165, 33);
                ctx.fillStyle = "#aaa"; ctx.font = "11px 'Courier New', Courier, monospace";
                ctx.fillText(walletAddress, canvas.width - 165, 50);
            }
        }

        function drawShopScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 30px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("COMMUNITY SHOP & BASKETS", canvas.width / 2, 75);
            ctx.fillStyle = "#ffffff"; ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillText("Equip upgraded baskets & support family care ❤️", canvas.width / 2, 105);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.strokeStyle = activeBox === 1 ? "#2ecc71" : "#3498db"; ctx.strokeRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.fillStyle = "#3498db"; ctx.fillText("100 EGG BOX", canvas.width / 2 - 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("Price: FREE", canvas.width / 2 - 190, 245);
            ctx.fillStyle = activeBox === 1 ? "#2ecc71" : "#fff"; ctx.fillText(activeBox === 1 ? "EQUIPPED" : "SELECT", canvas.width / 2 - 190, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.strokeStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f"); ctx.strokeRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.fillStyle = "#f1c40f"; ctx.fillText("250 EGG BOX", canvas.width / 2, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("Price: 50 PLAY", canvas.width / 2, 220);
            ctx.fillStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f");
            ctx.fillText(activeBox === 2 ? "EQUIPPED" : (unlockedBoxes.box2 ? "EQUIP" : "BUY NOW"), canvas.width / 2, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.strokeStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c"); ctx.strokeRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.fillStyle = "#e74c3c"; ctx.fillText("500 EGG BOX", canvas.width / 2 + 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("Price: 100 PLAY", canvas.width / 2 + 190, 220);
            ctx.fillStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c");
            ctx.fillText(activeBox === 3 ? "EQUIPPED" : (unlockedBoxes.box3 ? "EQUIP" : "SUPPORT"), canvas.width / 2 + 190, 295);

            if (txMessage !== "") {
                ctx.fillStyle = "#e67e22"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
                ctx.fillText(txMessage, canvas.width / 2, 410);
            }
            ctx.fillStyle = "#aaa"; ctx.font = "13px 'Courier New', Courier, monospace";
            ctx.fillText("Press ESC or ENTER to return to game", canvas.width / 2, 460);
            ctx.textAlign = "start";
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("PAUSE", canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Press SPACE to resume", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText(freeTrialMode && score >= FREE_TRIAL_LIMIT ? "TRIAL COMPLETED!" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = "#ffffff"; ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Eggplants caught: " + score, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillStyle = "#f1c40f"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Press ENTER to restart", canvas.width / 2, canvas.height / 2 + 70);
            ctx.textAlign = "start";
        }

        function restartGame() {
            gameStarted = false; isConnected = false; freeTrialMode = false;
            score = 0; lives = 3; baseSpeed = 0.5; lilky = []; spawnCounter = 0;
            isGameOver = false; isPaused = false; isShopOpen = false; shopTriggered = false;
            unlockedBoxes = { box1: true, box2: false, box3: false }; activeBox = 1;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(); 
            
            if (!gameStarted) { drawStartScreen(); requestAnimationFrame(gameLoop); return; }
            if (isGameOver) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawGameOver(); requestAnimationFrame(gameLoop); return; }
            if (isShopOpen) { drawShopScreen(); requestAnimationFrame(gameLoop); return; }
            if (isPaused) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawPauseScreen(); requestAnimationFrame(gameLoop); return; }

            updateAndDrawLilky();
            drawPlayerWithBasket();      
            drawUI();
            requestAnimationFrame(gameLoop);
        }

        playerImg.onload = () => { gameLoop(); };
        if(playerImg.complete) { gameLoop(); }
    </script>
</body>
</html>
