<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - Fixed Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #444; 
            background: #87CEEB; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Perfektně zarovnaná okna pro levou (šířka 220) a pravou stranu (od 680)
        const windows = [
            { id: 0, side: 'left', x: 0, y: 120, doorX: 220, doorY: 150, rampEndX: 300, rampEndY: 230 },
            { id: 1, side: 'left', x: 0, y: 340, doorX: 220, doorY: 370, rampEndX: 300, rampEndY: 450 },
            { id: 2, side: 'right', x: 680, y: 120, doorX: 680, doorY: 150, rampEndX: 600, rampEndY: 230 },
            { id: 3, side: 'right', x: 680, y: 340, doorX: 680, doorY: 370, rampEndX: 600, rampEndY: 450 }
        ];

        let playerPosIndex = 0; 
        let score = 0;
        
        let egg = { 
            x: 0, y: 0, 
            targetWindow: 0, 
            active: false, 
            progress: 0 
        };

        // Cihlová budova
        function drawBrickBuilding(startX, width) {
            ctx.fillStyle = "#A52A2A";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            ctx.fillStyle = "#8B0000";
            for (let i = 0; i < canvas.height - 100; i += 25) {
                for (let j = 0; j < width; j += 45) {
                    ctx.fillRect(startX + j + ((i / 25) % 2 === 0 ? 20 : 0), i, 40, 20);
                }
            }
        }

        function spawnEgg() {
            let idx = Math.floor(Math.random() * windows.length);
            egg.targetWindow = idx;
            egg.active = true;
            egg.progress = 0; // Začátek v místnosti
        }

        function update() {
            if (!egg.active) {
                // Pauza nebo okamžitý nový lilek podle potřeby
                if(Math.random() < 0.03) spawnEgg();
            } else {
                // Plynulý posun lilku (rychlost závisí na skóre, ale držíme ji v hratelných mezích)
                let speed = 0.015 + (score * 0.001);
                if (speed > 0.035) speed = 0.035;
                egg.progress += speed;

                if (egg.progress >= 1.0) {
                    // Kontrola chycení dole
                    if (playerPosIndex === egg.targetWindow) {
                        score++;
                    } else {
                        score = 0; 
                    }
                    egg.active = false;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obloha
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height - 100);

            // Budovy
            drawBrickBuilding(0, 220);
            drawBrickBuilding(680, 220);

            // Vykreslení místností a ramp
            windows.forEach(w => {
                // Interiér místnosti (dřevěná podlaha)
                let rx = w.side === 'left' ? 20 : 700;
                let ry = w.y - 15;
                ctx.fillStyle = "#d49a4f";
                ctx.fillRect(rx, ry, 180, 90);

                // Okno / dveře ven
                ctx.fillStyle = "#333";
                ctx.fillRect(w.side === 'left' ? 200 : 680, w.y, 20, 70);

                // Rampa ven do prostoru
                ctx.strokeStyle = "#DAA520";
                ctx.lineWidth = 8;
                ctx.beginPath();
                ctx.moveTo(w.side === 'left' ? 220 : 680, w.y + 50);
                ctx.lineTo(w.rampEndX, w.rampEndY);
                ctx.stroke();
            });

            // Silnice a chodník dole
            ctx.fillStyle = "#333"; ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            ctx.fillStyle = "#777"; ctx.fillRect(0, canvas.height - 105, canvas.width, 10);

            // Pozice hráče dole
            const playerCoords = [
                { x: 260, y: 440 }, // L-Horní
                { x: 260, y: 500 }, // L-Dolní
                { x: 600, y: 440 }, // P-Horní
                { x: 600, y: 500 }  // P-Dolní
            ];
            let p = playerCoords[playerPosIndex];

            // Postavička
            ctx.fillStyle = "#3498db";
            ctx.fillRect(p.x, p.y, 40, 50);
            ctx.fillStyle = "#f5cd79";
            ctx.fillRect(p.x + 4, p.y - 15, 32, 18);
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(p.x + 2, p.y - 22, 36, 8);

            // Vykreslení lilku podle toho, kde na trase zrovna je (interpolace)
            if (egg.active) {
                let w = windows[egg.targetWindow];
                let startX = w.side === 'left' ? 120 : 760;
                let startY = w.y + 35;
                
                let midX = w.rampEndX;
                let midY = w.rampEndY;

                let finalX = midX;
                let finalY = canvas.height - 80;

                let curX, curY;
                if (egg.progress < 0.6) {
                    // Fáze 1: Výběh z místnosti a sjetí po rampě
                    let t = egg.progress / 0.6;
                    curX = startX + (midX - startX) * t;
                    curY = startY + (midY - startY) * t;
                } else {
                    // Fáze 2: Padání z konce rampy dolů na chodník
                    let t = (egg.progress - 0.6) / 0.4;
                    curX = midX;
                    curY = midY + (finalY - midY) * t;
                }

                // Samotný lilek
                ctx.fillStyle = "#8e44ad";
                ctx.beginPath();
                ctx.ellipse(curX, curY, 12, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(curX - 3, curY - 20, 6, 6);
            }

            // Skóre
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px 'Courier New'";
            ctx.fillText("SCORE: " + score, canvas.width / 2 - 65, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Ovládání šipkami
        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") {
                playerPosIndex = playerPosIndex > 1 ? playerPosIndex - 2 : playerPosIndex;
            } else if (e.key === "ArrowDown") {
                playerPosIndex = playerPosIndex < 2 ? playerPosIndex + 2 : playerPosIndex;
            } else if (e.key === "ArrowLeft") {
                playerPosIndex = (playerPosIndex === 2 || playerPosIndex === 3) ? 0 : playerPosIndex;
            } else if (e.key === "ArrowRight") {
                playerPosIndex = (playerPosIndex === 0 || playerPosIndex === 1) ? 2 : playerPosIndex;
            }
        });

        spawnEgg();
        loop();
    </script>
</body>
</html>
