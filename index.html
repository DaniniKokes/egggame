<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - S životy a zrychlováním</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #444; 
            background: #2b2b2b; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ==========================================
        // SEKCE 1: BUDOVY, ULICE, ZEBRY A LAMPY
        // ==========================================
        const buildingWidth = 220;
        const themeColor = "#111111";

        const rooms = [
            { id: 0, side: 'left',  y: 55 },
            { id: 1, side: 'left',  y: 275 },
            { id: 2, side: 'right', y: 55 },
            { id: 3, side: 'right', y: 275 }
        ];

        function drawCleanBrickBuilding(startX, width, side) {
            ctx.fillStyle = "#A52A2A";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            
            ctx.fillStyle = "#8B0000";
            for (let i = 0; i < canvas.height - 100; i += 25) {
                for (let j = 0; j < width - 20; j += 45) {
                    let brickX = side === 'left' ? startX + j : startX + 20 + j;
                    ctx.fillRect(brickX, i, 40, 20);
                }
            }

            ctx.fillStyle = "#A52A2A";
            if (side === 'left') {
                ctx.fillRect(startX + width - 20, 0, 20, canvas.height - 100);
            } else {
                ctx.fillRect(startX, 0, 20, canvas.height - 100);
            }
        }

        function drawEnvironment() {
            ctx.fillStyle = "#2b2b2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#7c7c7c";
            ctx.fillRect(buildingWidth, 0, 30, canvas.height - 100); 
            ctx.fillRect(canvas.width - buildingWidth - 30, 0, 30, canvas.height - 100); 

            drawCleanBrickBuilding(0, buildingWidth, 'left');
            drawCleanBrickBuilding(canvas.width - buildingWidth, buildingWidth, 'right');

            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            let zebraTopY = 195;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraTopY, 14, 35);
            }

            let zebraBottomY = 415;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraBottomY, 14, 35);
            }

            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height - 100);
            ctx.stroke();
            ctx.setLineDash([]); 

            rooms.forEach(r => {
                if (r.side === 'left') {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(0, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(buildingWidth - 20, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 70);
                    ctx.lineTo(buildingWidth + 70, r.y + 130);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(canvas.width - buildingWidth + 20, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(canvas.width - buildingWidth, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 70);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 130);
                    ctx.stroke();
                }
            });

            const lampYPositions = [240, 480]; 
            lampYPositions.forEach(lampY => {
                ctx.fillStyle = "rgba(241, 196, 15, 0.3)";
                ctx.beginPath();
                ctx.arc(buildingWidth + 15, lampY, 30, 0, Math.PI * 2);
                ctx.arc(canvas.width - buildingWidth - 15, lampY, 30, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#555";
                ctx.fillRect(buildingWidth + 13, lampY - 15, 4, 30);
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(buildingWidth + 15, lampY, 3, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = "#555";
                ctx.fillRect(canvas.width - buildingWidth - 17, lampY - 15, 4, 30);
                ctx.fillStyle = "#f1c40f";
                ctx.beginPath();
                ctx.arc(canvas.width - buildingWidth - 15, lampY, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // ==========================================
        // SEKCE 2: PANÁČEK A OVLÁDÁNÍ
        // ==========================================
        const playerImg = new Image();
        playerImg.src = "player.png";

        const positions = [
            { x: buildingWidth + 50, y: 155, roomIndex: 0, side: 'left' },  
            { x: buildingWidth + 50, y: 375, roomIndex: 1, side: 'left' },  
            { x: canvas.width - buildingWidth - 95, y: 155, roomIndex: 2, side: 'right' }, 
            { x: canvas.width - buildingWidth - 95, y: 375, roomIndex: 3, side: 'right' }  
        ];

        let currentPosIndex = 1;
        let animTimer = 0;
        let isMovingEffect = false;
        let score = 0;
        let lives = 3;         // Počet životů
        let isGameOver = false;

        window.addEventListener("keydown", (e) => {
            if (isGameOver) {
                if (e.key === "Enter") restartGame();
                return;
            }

            let oldIndex = currentPosIndex;
            if (e.key === "ArrowUp") {
                if (currentPosIndex === 1) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                if (currentPosIndex === 2) currentPosIndex = 3;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                if (currentPosIndex === 1) currentPosIndex = 3;
            }

            if (oldIndex !== currentPosIndex) {
                isMovingEffect = true;
                animTimer = 10;
            }
        });

        function drawPlayer() {
            let targetPos = positions[currentPosIndex];
            let width = 45;
            let height = 65;
            let renderX = targetPos.x;
            let renderY = targetPos.y;

            if (isMovingEffect) {
                animTimer--;
                width += 6;
                height -= 6;
                renderY += 4;
                if (animTimer <= 0) isMovingEffect = false;
            }

            ctx.save();
            if (targetPos.side === 'right') {
                ctx.translate(renderX + width / 2, renderY + height / 2);
                ctx.scale(-1, 1);
                ctx.translate(-(renderX + width / 2), -(renderY + height / 2));
            }

            if (playerImg.complete) {
                ctx.drawImage(playerImg, renderX, renderY, width, height);
            }
            ctx.restore();
        }

        // ==========================================
        // SEKCE 3: LILKY, RYCHLOST A PADÁNÍ NA ZEM
        // ==========================================
        const lilekImg = new Image();
        lilekImg.src = "lilek.png"; 

        let lilky = [];
        let spawnCounter = 0;
        let baseSpeed = 0.7; // Začínáme pomaleji

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];

            let isLeft = r.side === 'left';
            let startX = isLeft ? 30 : canvas.width - 30;
            let startY = r.y + 70; 

            lilky.push({
                roomIndex: rIdx,
                x: startX,
                y: startY,
                isLeft: isLeft,
                speed: baseSpeed,
                state: 'room', // 'room', 'ramp', 'falling', 'ground'
                angle: 0 
            });
        }

        function updateAndDrawLilky() {
            spawnCounter++;
            // Interval spawnování se s rostoucím skóre zkracuje (chodí častěji)
            let currentSpawnInterval = Math.max(70, 160 - (score * 4));

            if (spawnCounter > currentSpawnInterval) { 
                spawnLilek();
                spawnCounter = 0;
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                // 1. Pohyb v místnosti
                if (l.state === 'room') {
                    let windowX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                    l.x += l.isLeft ? l.speed : -l.speed;
                    l.y = r.y + 70;
                    l.angle += l.isLeft ? 0.04 : -0.04;

                    if ((l.isLeft && l.x >= windowX) || (!l.isLeft && l.x <= windowX)) {
                        l.state = 'ramp';
                    }
                } 
                // 2. Pohyb po rampě dolů do ulice
                else if (l.state === 'ramp') {
                    let rampStartX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                    let rampStartY = r.y + 70;

                    l.x += l.isLeft ? l.speed : -l.speed;
                    let progress = l.isLeft ? (l.x - rampStartX) / 70 : (rampStartX - l.x) / 70;
                    l.y = rampStartY + (progress * 60) - 6;
                    l.angle += l.isLeft ? 0.06 : -0.06;

                    // Kontrola, zda lilek dorazil k panáčkovi (sběrná zóna)
                    let targetPos = positions[l.roomIndex];
                    let catchAreaX = targetPos.x + 15;
                    let catchAreaY = targetPos.y + 20;
                    let distance = Math.hypot(l.x - catchAreaX, l.y - catchAreaY);

                    if (distance < 30) {
                        lilky.splice(i, 1); 
                        score++;
                        // Zvýšení celkové rychlosti hry s každým bodem
                        baseSpeed = 0.7 + (score * 0.04);
                        continue;
                    }

                    // Pokud panáček lilek minul, rampa končí a lilek padá dál do silnice
                    let endOfRampX = l.isLeft ? buildingWidth + 75 : canvas.width - buildingWidth - 75;
                    if ((l.isLeft && l.x > endOfRampX) || (!l.isLeft && l.x < endOfRampX)) {
                        l.state = 'falling';
                    }
                } 
                // 3. Volný pád dál do ulice na zem
                else if (l.state === 'falling') {
                    l.y += 3.5; // Rychlý pád dolů
                    l.x += l.isLeft ? 0.5 : -0.5;
                    l.angle += 0.1;

                    // Dopad na zem (asfalt dole u chodníku / podlahy)
                    let groundY = canvas.height - 110;
                    if (l.y >= groundY) {
                        l.y = groundY;
                        l.state = 'ground';
                        lives--; // Ztráta života!
                        if (lives <= 0) {
                            isGameOver = true;
                        }
                    }
                }

                // Vykreslení lilku
                ctx.save();
                ctx.translate(l.x, l.y - 10);
                ctx.rotate(l.angle);

                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -15, -15, 30, 30);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Odstranění lilků ležících na zemi po chvíli nebo mimo obraz
                if (l.state === 'ground') {
                    // Můžeme je nechat chvíli ležet nebo je hned odstranit po pár snímcích, tady je po chvíli smažeme
                    if (Math.random() < 0.02) lilky.splice(i, 1);
                }
            }
        }

        // ==========================================
        // UI: SKÓRE A ŽIVOTY
        // ==========================================
        function drawUI() {
            // Skóre tabule (uprostřed)
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(canvas.width / 2 - 110, 15, 220, 40);
            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 110, 15, 220, 40);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText("Lilky: " + score + " | Životy: " + lives, canvas.width / 2, 42);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff4d4d";
            ctx.font = "bold 45px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = "#ffffff";
            ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Uloveno lilků: " + score, canvas.width / 2, canvas.height / 2 + 20);
            
            ctx.fillStyle = "#f1c40f";
            ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Stisknutím ENTER hru restartuješ", canvas.width / 2, canvas.height / 2 + 70);
            ctx.textAlign = "start";
        }

        function restartGame() {
            score = 0;
            lives = 3;
            baseSpeed = 0.7;
            lilky = [];
            isGameOver = false;
        }

        // ==========================================
        // HLAVNÍ HERNÍ SMYČKA
        // ==========================================
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment(); 
            updateAndDrawLilky();
            drawPlayer();      
            drawUI();

            if (isGameOver) {
                drawGameOver();
            } else {
                requestAnimationFrame(gameLoop);
            }
        }

        // Spuštění po načtení obrázku
        playerImg.onload = () => {
            gameLoop();
        };
        if(playerImg.complete) {
            gameLoop();
        }
    </script>
</body>
</html>
