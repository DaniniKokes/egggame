<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - PSG1 Deluxe Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #09090c; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #1a1a24; 
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
            background: #1f1f2e; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let isConnected = false;
        let playTokenBalance = 500; 
        let freeTrialMode = false;
        const FREE_TRIAL_LIMIT = 50;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundMusicInterval = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(950, now + 0.12);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now); osc.stop(now + 0.12);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(280, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                osc.frequency.setValueAtTime(90, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'shop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(650, now);
                osc.frequency.setValueAtTime(950, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        function startBackgroundMusic() {
            if (backgroundMusicInterval) return;
            const notes = [220, 277, 330, 440, 554, 330, 277];
            let index = 0;
            backgroundMusicInterval = setInterval(() => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let now = audioCtx.currentTime;
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[index], now);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                index = (index + 1) % notes.length;
            }, 200);
        }

        let gameStarted = false;

        const bgImg = new Image();
        bgImg.src = "hlavni stranka.png";

        const playerImg = new Image();
        playerImg.src = "player1.png";

        const lilekImg = new Image();
        lilekImg.src = "lilek.png";

        let processedPlayerCanvas = null;
        function preparePlayerImage() {
            if (!playerImg.complete || playerImg.naturalWidth === 0) return;
            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = playerImg.width;
            tempCanvas.height = playerImg.height;
            let tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(playerImg, 0, 0);
            
            let imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            let data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                if (r > 230 && g > 230 && b > 230) {
                    data[i+3] = 0;
                }
            }
            tCtx.putImageData(imgData, 0, 0);
            processedPlayerCanvas = tempCanvas;
        }
        playerImg.onload = preparePlayerImage;

        // Opravená výška horních a dolních pater přímo na podlahy budov
        const rooms = [
            { id: 0, side: 'left',  y: 205, startX: 70,  endX: 305 }, // Horní patro vlevo
            { id: 1, side: 'left',  y: 355, startX: 70,  endX: 305 }, // Dolní patro vlevo (opraveno!)
            { id: 2, side: 'right', y: 205, startX: 830, endX: 595 }, // Horní patro vpravo
            { id: 3, side: 'right', y: 355, startX: 830, endX: 595 }  // Dolní patro vpravo (opraveno!)
        ];

        // Pozice panáčka přesně u balkonů a dole na silnici
        const positions = [
            { x: 315, y: 180, side: 'left' },  
            { x: 315, y: 330, side: 'left' },  
            { x: 540, y: 180, side: 'right' }, 
            { x: 540, y: 330, side: 'right' }, 
            { x: 450, y: 495, side: 'center' }   // Silnice
        ];

        let currentPosIndex = 4; // Start na silnici
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = false;
        let isShopOpen = false;
        let shopTriggered = false; 
        let unlockedBoxes = { box1: true, box2: false, box3: false };
        let activeBox = 1; 
        let txPending = false;
        let txMessage = "";
        let catchAnimFrames = 0; 
        let baseSpeed = 0.8;

        function drawEnvironment() {
            if (bgImg.complete && bgImg.naturalWidth !== 0) {
                ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#12121a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        function drawTopBoxes() {
            let startX = canvas.width / 2 - 165;
            let boxWidth = 100;
            let boxHeight = 45;
            let y = 15;
            const boxesData = [
                { id: 1, name: "100 EGG", unlocked: true },
                { id: 2, name: "250 EGG", unlocked: unlockedBoxes.box2 },
                { id: 3, name: "500 EGG", unlocked: unlockedBoxes.box3 }
            ];
            boxesData.forEach((b, index) => {
                let x = startX + (index * 115);
                ctx.fillStyle = activeBox === b.id ? "#3498db" : (b.unlocked ? "#9b59b6" : "#2c2c38");
                ctx.fillRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.fillStyle = activeBox === b.id ? "#5dade2" : (b.unlocked ? "#af7ac5" : "#3b3b4f");
                ctx.fillRect(x - 4, y, boxWidth + 8, 12);
                ctx.strokeStyle = b.unlocked ? "#f1c40f" : "#444";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.strokeRect(x - 4, y, boxWidth + 8, 12);
                ctx.fillStyle = b.unlocked ? "#ffffff" : "#777";
                ctx.font = "bold 12px 'Courier New', Courier, monospace";
                ctx.fillText(b.name, x + 12, y + 32);
            });
        }

        window.addEventListener("keydown", (e) => {
            startBackgroundMusic();
            if (!gameStarted) return;
            if (isGameOver) {
                if (e.key === "Enter" || e.code === "Space") restartGame();
                return;
            }
            if (isShopOpen) {
                if (!txPending && (e.key === "Escape" || e.key === "Enter")) isShopOpen = false;
                return;
            }
            if (e.code === "Space") {
                isPaused = !isPaused;
                playSound('shop');
                return;
            }
            if (isPaused) return;

            if (e.key === "ArrowUp") {
                if (currentPosIndex === 4) currentPosIndex = 1;
                else if (currentPosIndex === 1) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                else if (currentPosIndex === 2) currentPosIndex = 3;
                else if (currentPosIndex === 1 || currentPosIndex === 3) currentPosIndex = 4;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                else if (currentPosIndex === 3) currentPosIndex = 1;
                else if (currentPosIndex === 4) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                else if (currentPosIndex === 1) currentPosIndex = 3;
                else if (currentPosIndex === 4) currentPosIndex = 3;
            }
        });

        window.addEventListener("click", (e) => {
            startBackgroundMusic();
            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            if (!gameStarted) {
                if (mouseX >= canvas.width / 2 - 240 && mouseX <= canvas.width / 2 - 20 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    isConnected = true; freeTrialMode = false; gameStarted = true; playSound('shop'); return;
                }
                if (mouseX >= canvas.width / 2 + 20 && mouseX <= canvas.width / 2 + 240 && mouseY >= canvas.height / 2 + 20 && mouseY <= canvas.height / 2 + 80) {
                    freeTrialMode = true; gameStarted = true; playSound('shop'); return;
                }
                return;
            }

            if (isShopOpen && !txPending) {
                if (mouseX >= canvas.width / 2 - 270 && mouseX <= canvas.width / 2 - 120 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box2) buyBox('box2', 50, 2); else activeBox = 2;
                }
                if (mouseX >= canvas.width / 2 + 110 && mouseX <= canvas.width / 2 + 270 && mouseY >= 160 && mouseY <= 335) {
                    if (!unlockedBoxes.box3) buyBox('box3', 100, 3); else activeBox = 3;
                }
                return;
            }

            let closestIndex = 0;
            let minDist = 9999;
            positions.forEach((pos, idx) => {
                let dist = Math.hypot(mouseX - pos.x, mouseY - pos.y);
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = idx;
                }
            });
            if (minDist < 180) {
                currentPosIndex = closestIndex;
            }
        });

        function buyBox(boxKey, price, boxId) {
            if (playTokenBalance < price) {
                txMessage = "Nedostatek PLAY tokenů!";
                setTimeout(() => { txMessage = ""; }, 2500);
                return;
            }
            txPending = true;
            txMessage = "Zpracovávám transakci...";
            setTimeout(() => {
                playTokenBalance -= price;
                unlockedBoxes[boxKey] = true;
                activeBox = boxId;
                txPending = false;
                txMessage = "Úspěšně odemčeno! ❤️";
                playSound('shop');
                setTimeout(() => { txMessage = ""; }, 3000);
            }, 1000);
        }

        function drawPlayerWithBasket() {
            let targetPos = positions[currentPosIndex];
            let width = 50;
            let height = 75;
            let renderX = targetPos.x - width / 2;
            let renderY = targetPos.y;

            ctx.save();
            
            // Naklánění a otáčení panáčka s krabicí podle strany budovy
            if (targetPos.side === 'left') {
                ctx.translate(renderX + width / 2, renderY + height / 2);
                ctx.scale(-1, 1); // Otočení směrem k budově
                ctx.rotate(0.05); // Jemné naklonění
                ctx.translate(-(renderX + width / 2), -(renderY + height / 2));
            } else if (targetPos.side === 'right') {
                ctx.translate(renderX + width / 2, renderY + height / 2);
                ctx.rotate(-0.05); // Opačné naklonění pro pravou stranu
                ctx.translate(-(renderX + width / 2), -(renderY + height / 2));
            }

            let sourceToDraw = processedPlayerCanvas ? processedPlayerCanvas : playerImg;
            if (sourceToDraw) {
                ctx.drawImage(sourceToDraw, renderX, renderY, width, height);
            }
            ctx.restore();
        }

        let lilky = [];
        let spawnCounter = 0;

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];
            let startX = r.startX;
            let startY = r.y; 

            lilky.push({
                roomIndex: rIdx, x: startX, y: startY, isLeft: r.side === 'left',
                speed: baseSpeed, state: 'walking', angle: 0, counted: false
            });
        }

        function updateAndDrawLilky() {
            if (!isPaused && !isGameOver && !isShopOpen) {
                spawnCounter++;
                let currentSpawnInterval = Math.max(80, 160 - (score * 2));
                if (spawnCounter > currentSpawnInterval) { 
                    spawnLilek();
                    spawnCounter = 0;
                }
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (!isPaused && !isGameOver && !isShopOpen) {
                    if (l.state === 'walking') {
                        l.x += l.isLeft ? l.speed : -l.speed;
                        
                        // Krátká rampa u okna (mírný sestup/výstup na balkon)
                        let rampZone = 30;
                        if (l.isLeft && l.x > r.endX - rampZone) {
                            let progress = (l.x - (r.endX - rampZone)) / rampZone;
                            l.y = r.y + (progress * 15); // Rampa vede lehce dolů/ven na balkon
                        } else if (!l.isLeft && l.x < r.endX + rampZone) {
                            let progress = ((r.endX + rampZone) - l.x) / rampZone;
                            l.y = r.y + (progress * 15);
                        } else {
                            l.y = r.y;
                        }

                        l.angle += l.isLeft ? 0.04 : -0.04;
                        
                        let reachX = r.endX;
                        if ((l.isLeft && l.x >= reachX) || (!l.isLeft && l.x <= reachX)) {
                            l.state = 'at_balcony';
                        }
                    } else if (l.state === 'at_balcony') {
                        if (currentPosIndex === l.roomIndex) {
                            playSound('catch'); 
                            catchAnimFrames = 8; 
                            lilky.splice(i, 1); 
                            score++;
                            baseSpeed = 0.8 + (score * 0.015); 

                            if (freeTrialMode && score >= FREE_TRIAL_LIMIT) {
                                isGameOver = true; playSound('gameover');
                            }
                            if (score >= 100 && !shopTriggered) {
                                shopTriggered = true; isShopOpen = true; playSound('shop');
                            }
                            continue;
                        } else {
                            l.state = 'falling';
                        }
                    } else if (l.state === 'falling') {
                        l.y += 4; l.angle += 0.1;
                        let groundY = canvas.height - 100;
                        if (l.y >= groundY) {
                            l.y = groundY;
                            l.state = 'ground';
                            if (!l.counted) {
                                playSound('drop'); 
                                lives--;
                                l.counted = true;
                                if (lives <= 0) { playSound('gameover'); isGameOver = true; }
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.rotate(l.angle);
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -15, -15, 30, 30);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();

                if (!isPaused && l.state === 'ground' && Math.random() < 0.03) {
                    lilky.splice(i, 1);
                }
            }
        }

        function drawStartScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 36px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("EGG & EGGPLANT", canvas.width / 2, canvas.height / 2 - 90);
            ctx.fillStyle = "#3498db"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText("PSG1 DELUXE EDITION", canvas.width / 2, canvas.height / 2 - 50);

            ctx.fillStyle = "#2ecc71"; ctx.fillRect(canvas.width / 2 - 240, canvas.height / 2 + 20, 220, 60);
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(canvas.width / 2 - 240, canvas.height / 2 + 20, 220, 60);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillText("CONNECT WALLET", canvas.width / 2 - 130, canvas.height / 2 + 47);

            ctx.fillStyle = "#9b59b6"; ctx.fillRect(canvas.width / 2 + 20, canvas.height / 2 + 20, 220, 60);
            ctx.strokeRect(canvas.width / 2 + 20, canvas.height / 2 + 20, 220, 60);
            ctx.fillStyle = "#ffffff";
            ctx.fillText("FREE TRIAL", canvas.width / 2 + 130, canvas.height / 2 + 47);
            ctx.textAlign = "start";
        }

        function drawUI() {
            ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(15, 15, 130, 45, 8); ctx.fill();
            ctx.strokeStyle = "#3498db"; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = "#3498db"; ctx.fillText("SCORE", 25, 33);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText(score, 25, 52);

            drawTopBoxes();

            ctx.fillStyle = "rgba(20, 20, 30, 0.9)";
            ctx.beginPath(); ctx.roundRect(canvas.width - 175, 15, 160, 45, 8); ctx.fill();
            ctx.strokeStyle = freeTrialMode ? "#9b59b6" : "#2ecc71"; ctx.stroke();
            ctx.fillStyle = freeTrialMode ? "#9b59b6" : "#2ecc71"; ctx.font = "bold 13px 'Courier New', Courier, monospace";
            if (freeTrialMode) {
                ctx.fillText("🎮 FREE TRIAL", canvas.width - 165, 33);
                ctx.fillStyle = "#aaa"; ctx.font = "11px 'Courier New', Courier, monospace";
                ctx.fillText("Goal: " + score + "/50", canvas.width - 165, 50);
            } else {
                ctx.fillText("💰 " + playTokenBalance + " PLAY", canvas.width - 165, 33);
            }

            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("Životy: " + "❤️".repeat(lives), 15, 85);
        }

        function drawShopScreen() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 30px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("COMMUNITY SHOP & BASKETS", canvas.width / 2, 75);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.strokeStyle = activeBox === 1 ? "#2ecc71" : "#3498db"; ctx.strokeRect(canvas.width / 2 - 270, 160, 160, 175);
            ctx.fillStyle = "#3498db"; ctx.fillText("100 EGG BOX", canvas.width / 2 - 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("ZDARMA", canvas.width / 2 - 190, 245);
            ctx.fillStyle = activeBox === 1 ? "#2ecc71" : "#fff"; ctx.fillText(activeBox === 1 ? "VYBRÁNO" : "ZVOLIT", canvas.width / 2 - 190, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.strokeStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f"); ctx.strokeRect(canvas.width / 2 - 80, 160, 160, 175);
            ctx.fillStyle = "#f1c40f"; ctx.fillText("250 EGG BOX", canvas.width / 2, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("50 PLAY", canvas.width / 2, 220);
            ctx.fillStyle = activeBox === 2 ? "#2ecc71" : (unlockedBoxes.box2 ? "#3498db" : "#f1c40f");
            ctx.fillText(activeBox === 2 ? "VYBRÁNO" : (unlockedBoxes.box2 ? "ZVOLIT" : "KOUPIT"), canvas.width / 2, 295);

            ctx.fillStyle = "#1c1c28"; ctx.fillRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.strokeStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c"); ctx.strokeRect(canvas.width / 2 + 110, 160, 160, 175);
            ctx.fillStyle = "#e74c3c"; ctx.fillText("500 EGG BOX", canvas.width / 2 + 190, 190);
            ctx.fillStyle = "#fff"; ctx.fillText("100 PLAY", canvas.width / 2 + 190, 220);
            ctx.fillStyle = activeBox === 3 ? "#2ecc71" : (unlockedBoxes.box3 ? "#3498db" : "#e74c3c");
            ctx.fillText(activeBox === 3 ? "VYBRÁNO" : (unlockedBoxes.box3 ? "ZVOLIT" : "KOUPIT"), canvas.width / 2 + 190, 295);

            if (txMessage !== "") {
                ctx.fillStyle = "#e67e22"; ctx.font = "bold 16px 'Courier New', Courier, monospace";
                ctx.fillText(txMessage, canvas.width / 2, 410);
            }
            ctx.fillStyle = "#aaa"; ctx.font = "13px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte ESC nebo ENTER pro návrat", canvas.width / 2, 460);
            ctx.textAlign = "start";
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#f1c40f"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText("PAUZA", canvas.width / 2, canvas.height / 2 - 15);
            ctx.fillStyle = "#ffffff"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte MEZERNÍK pro pokračování", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(10, 10, 15, 0.9)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4d4d"; ctx.font = "bold 45px 'Courier New', Courier, monospace"; ctx.textAlign = "center";
            ctx.fillText(freeTrialMode && score >= FREE_TRIAL_LIMIT ? "TRIAL DOKONČEN!" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 30);
            ctx.fillStyle = "#ffffff"; ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Chyceno lilek: " + score, canvas.width / 2, canvas.height / 2 + 20);
            ctx.fillStyle = "#f1c40f"; ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Stiskněte ENTER pro restart", canvas.width / 2, canvas.height / 2 + 70);
            ctx.textAlign = "start";
        }

        function restartGame() {
            gameStarted = false; freeTrialMode = false;
            score = 0; lives = 3; baseSpeed = 0.8; lilky = []; spawnCounter = 0;
            isGameOver = false; isPaused = false; isShopOpen = false; shopTriggered = false;
            unlockedBoxes = { box1: true, box2: false, box3: false }; activeBox = 1;
            currentPosIndex = 4;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawEnvironment(); 
            
            if (!gameStarted) { drawStartScreen(); requestAnimationFrame(gameLoop); return; }
            if (isGameOver) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawGameOver(); requestAnimationFrame(gameLoop); return; }
            if (isShopOpen) { drawShopScreen(); requestAnimationFrame(gameLoop); return; }
            if (isPaused) { updateAndDrawLilky(); drawPlayerWithBasket(); drawUI(); drawPauseScreen(); requestAnimationFrame(gameLoop); return; }

            updateAndDrawLilky();
            drawPlayerWithBasket();      
            drawUI();
            requestAnimationFrame(gameLoop);
        }

        bgImg.onload = () => { gameLoop(); };
        if(bgImg.complete) { gameLoop(); }
