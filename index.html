<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg & Lilek Solana Style</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #2b1d0c;
            border: 4px solid #4a3319;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: none;
        }
        h1 { margin: 5px; font-size: 22px; color: #00ffcc; text-shadow: 2px 2px #ff00ff; }
    </style>
</head>
<body>

    <h1>OFFICE EGG CATCHER (Solana Style)</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Pozice oken na budovách
        const buildingWindows = [
            { x: 90, y: 200 },
            { x: 90, y: 320 },
            { x: canvas.width - 90, y: 200 },
            { x: canvas.width - 90, y: 320 }
        ];

        // Hráč (postava v kanceláři)
        let player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 60,
            score: 0
        };

        // Lilek / Vajíčko
        let egg = {
            x: 0, y: 0,
            radiusX: 12,
            radiusY: 17,
            vx: 0, vy: 0,
            active: false
        };

        function resetEggToWindow() {
            const startWindow = buildingWindows[Math.floor(Math.random() * buildingWindows.length)];
            egg.x = startWindow.x;
            egg.y = startWindow.y;
            egg.vy = 0;
            egg.vx = (startWindow.x < canvas.width / 2) ? 3.5 : -3.5;
            egg.active = true;
        }

        resetEggToWindow();

        // Ovládání myší
        canvas.addEventListener("mousemove", (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = (e.clientX - rect.left) - player.width / 2;
            if (player.x < 100) player.x = 100;
            if (player.x > canvas.width - 100 - player.width) player.x = canvas.width - 100 - player.width;
        });

        function update() {
            if (!egg.active) return;

            egg.x += egg.vx;
            egg.y += egg.vy;
            egg.vy += 0.22; // Gravitace

            // Odrazy od stěn budov
            if (egg.x <= 110 || egg.x >= canvas.width - 110) {
                egg.vx *= -1;
            }

            // Chycení postavou
            if (
                egg.y + egg.radiusY >= player.y &&
                egg.x > player.x &&
                egg.x < player.x + player.width
            ) {
                player.score += 1;
                resetEggToWindow();
            }

            // Pád na zem
            if (egg.y > canvas.height) {
                player.score = 0;
                resetEggToWindow();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- 1. DŘEVĚNÁ PODLAHA (Pixel art textura) ---
            ctx.fillStyle = "#3d2612";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#2b1a0c";
            ctx.lineWidth = 2;
            for(let i = 0; i < canvas.height; i += 40) {
                ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
            }

            // --- 2. BUDOVY A KANCELÁŘSKÉ VYBAVENÍ ---
            // Levá budova/stěna
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(0, 0, 110, canvas.height);
            // Pravá budova/stěna
            ctx.fillRect(canvas.width - 110, 0, 110, canvas.height);

            // Okna na budovách
            ctx.fillStyle = "#1abc9c";
            buildingWindows.forEach(win => {
                ctx.fillRect(win.x - 15, win.y - 25, 30, 50);
                // Rám okna
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.strokeRect(win.x - 15, win.y - 25, 30, 50);
            });

            // Kancelářské doplňky (květináč vlevo nahoře)
            ctx.fillStyle = "#e67e22"; ctx.fillRect(30, 100, 30, 30);
            ctx.fillStyle = "#27ae60"; ctx.beginPath(); ctx.arc(45, 90, 20, 0, Math.PI*2); ctx.fill();

            // Automat na vodu vpravo nahoře
            ctx.fillStyle = "#bdc3c7"; ctx.fillRect(canvas.width - 50, 80, 35, 70);
            ctx.fillStyle = "#3498db"; ctx.fillRect(canvas.width - 45, 90, 25, 25);

            // --- 3. POSTAVA (Panáček v modrém s vlasy) ---
            // Tělo (modré tričko)
            ctx.fillStyle = "#3498db";
            ctx.fillRect(player.x + 10, player.y + 20, player.width - 20, player.height - 20);
            // Hlava
            ctx.fillStyle = "#f5cd79";
            ctx.fillRect(player.x + 12, player.y, 26, 22);
            // Vlasy (tmavé rozcušené)
            ctx.fillStyle = "#2c3e50";
            ctx.fillRect(player.x + 10, player.y - 6, 30, 10);
            // Oči panáčka
            ctx.fillStyle = "#000";
            ctx.fillRect(player.x + 18, player.y + 7, 3, 3);
            ctx.fillRect(player.x + 29, player.y + 7, 3, 3);

            // --- 4. LILEK (Protažený s očima) ---
            if (egg.active) {
                ctx.fillStyle = "#8e44ad";
                ctx.beginPath();
                ctx.ellipse(egg.x, egg.y, egg.radiusX, egg.radiusY, 0, 0, Math.PI * 2);
                ctx.fill();
                // Stopka
                ctx.fillStyle = "#27ae60";
                ctx.fillRect(egg.x - 3, egg.y - egg.radiusY - 6, 6, 6);
                // Oči lilku
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 4, 3, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = "black";
                ctx.beginPath(); ctx.arc(egg.x - 4, egg.y - 4, 1.2, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(egg.x + 4, egg.y - 4, 1.2, 0, Math.PI*2); ctx.fill();
            }

            // --- SKÓRE ---
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px 'Courier New'";
            ctx.fillText("SCORE: " + player.score, canvas.width / 2 - 50, 40);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
