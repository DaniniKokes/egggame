<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - Kompletní hra</title>
    <style>
        body { 
            margin: 0; 
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #444; 
            background: #87CEEB; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ==========================================
        // SEKCE 1: BUDOVY A PROSTŘEDÍ
        // ==========================================
        const buildingWidth = 220;
        const themeColor = "#111111";

        const rooms = [
            { id: 0, side: 'left',  y: 55 },
            { id: 1, side: 'left',  y: 275 },
            { id: 2, side: 'right', y: 55 },
            { id: 3, side: 'right', y: 275 }
        ];

        function drawCleanBrickBuilding(startX, width, side) {
            ctx.fillStyle = "#A52A2A";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            
            ctx.fillStyle = "#8B0000";
            for (let i = 0; i < canvas.height - 100; i += 25) {
                for (let j = 0; j < width - 20; j += 45) {
                    let brickX = side === 'left' ? startX + j : startX + 20 + j;
                    ctx.fillRect(brickX, i, 40, 20);
                }
            }

            ctx.fillStyle = "#A52A2A";
            if (side === 'left') {
                ctx.fillRect(startX + width - 20, 0, 20, canvas.height - 100);
            } else {
                ctx.fillRect(startX, 0, 20, canvas.height - 100);
            }
        }

        function drawEnvironment() {
            ctx.fillStyle = "#87CEEB";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCleanBrickBuilding(0, buildingWidth, 'left');
            drawCleanBrickBuilding(canvas.width - buildingWidth, buildingWidth, 'right');

            rooms.forEach(r => {
                if (r.side === 'left') {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(0, r.y - 15, buildingWidth - 20, 85);
                    
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(buildingWidth - 20, r.y + 10, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 60);
                    ctx.lineTo(buildingWidth + 70, r.y + 120);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(canvas.width - buildingWidth + 20, r.y - 15, buildingWidth - 20, 85);

                    ctx.fillStyle = themeColor;
                    ctx.fillRect(canvas.width - buildingWidth, r.y + 10, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 60);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 120);
                    ctx.stroke();
                }
            });

            // Spodní silnice
            ctx.fillStyle = "#333";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // ==========================================
        // SEKCE 2: PANÁČEK A OVLÁDÁNÍ
        // ==========================================
        const playerImg = new Image();
        playerImg.src = "player.png";

        const positions = [
            { x: buildingWidth + 30, y: 200, roomIndex: 0 }, 
            { x: buildingWidth + 30, y: 420, roomIndex: 1 }, 
            { x: canvas.width - buildingWidth - 75, y: 200, roomIndex: 2 }, 
            { x: canvas.width - buildingWidth - 75, y: 420, roomIndex: 3 }  
        ];

        let currentPosIndex = 1;
        let animTimer = 0;
        let isMovingEffect = false;

        window.addEventListener("keydown", (e) => {
            let oldIndex = currentPosIndex;
            if (e.key === "ArrowUp") {
                if (currentPosIndex === 1) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                if (currentPosIndex === 2) currentPosIndex = 3;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                if (currentPosIndex === 1) currentPosIndex = 3;
            }

            if (oldIndex !== currentPosIndex) {
                isMovingEffect = true;
                animTimer = 10;
            }
        });

        function drawPlayer() {
            let targetPos = positions[currentPosIndex];
            let width = 45;
            let height = 65;
            let renderX = targetPos.x;
            let renderY = targetPos.y;

            if (isMovingEffect) {
                animTimer--;
                width += 6;
                height -= 6;
                renderY += 4;
                if (animTimer <= 0) isMovingEffect = false;
            }

            if (playerImg.complete) {
                ctx.drawImage(playerImg, renderX, renderY, width, height);
            }
        }

        // ==========================================
        // SEKCE 3: LILKY (SPRÁVNÁ POZICE MÍSTNOSTI A RAMPY)
        // ==========================================
        const lilekImg = new Image();
        lilekImg.src = "lilek.png"; 

        let lilky = [];
        let spawnCounter = 0;

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];

            let isLeft = r.side === 'left';
            
            // Startuje uvnitř místnosti
            let startX = isLeft ? 50 : canvas.width - 50;
            // Výška přesně na podlaze místnosti (r.y + 10 je horní okraj místnosti, podlaha je níže)
            let startY = r.y + 50; 

            lilky.push({
                roomIndex: rIdx,
                x: startX,
                y: startY,
                isLeft: isLeft,
                speed: 1.2,
                state: 'room' // 'room' = běží v místnosti, 'ramp' = kutálí se po rampě
            });
        }

        function updateAndDrawLilky() {
            spawnCounter++;
            if (spawnCounter > 150) { 
                spawnLilek();
                spawnCounter = 0;
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                // FÁZE 1: Běží uvnitř místnosti k oknu / průchodu do rampy
                if (l.state === 'room') {
                    // Pozice, kde končí místnost a začíná rampa
                    let windowX = l.isLeft ? (buildingWidth - 20) : (canvas.width - buildingWidth + 20);

                    if (l.isLeft) {
                        l.x += l.speed;
                        l.y = r.y + 50; // drží se rovně na podlaze místnosti
                        if (l.x >= windowX) {
                            l.state = 'ramp';
                        }
                    } else {
                        l.x -= l.speed;
                        l.y = r.y + 50; // drží se rovně na podlaze místnosti
                        if (l.x <= windowX) {
                            l.state = 'ramp';
                        }
                    }
                } 
                // FÁZE 2: Kutálí se po šikmé rampě dolů
                else if (l.state === 'ramp') {
                    if (l.isLeft) {
                        l.x += l.speed;
                        let rampStartX = buildingWidth - 20;
                        let rampStartY = r.y + 60; // přesný začátek rampy u zdi
                        let progress = (l.x - rampStartX) / 70; // délka rampy
                        // Výpočet y tak, aby lilek jel přesně po čáře rampy (spojnice od okna k panáčkovi)
                        let targetY = r.y + 120;
                        l.y = rampStartY + progress * (targetY - rampStartY);
                    } else {
                        l.x -= l.speed;
                        let rampStartX = canvas.width - buildingWidth + 20;
                        let rampStartY = r.y + 60;
                        let progress = (rampStartX - l.x) / 70;
                        let targetY = r.y + 120;
                        l.y = rampStartY + progress * (targetY - rampStartY);
                    }
                }

                // Vykreslení lilku (vycentrovaný tak, aby seděl na čáře)
                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, l.x - 15, l.y - 25, 30, 30);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath();
                    ctx.arc(l.x, l.y - 10, 12, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Kontrola chycení panáčkem na konci rampy
                let targetPos = positions[l.roomIndex];
                let catchAreaX = targetPos.x + 15;
                let catchAreaY = targetPos.y + 20;

                let distance = Math.hypot(l.x - catchAreaX, l.y - catchAreaY);
                if (distance < 30) {
                    lilky.splice(i, 1); // Chyceno!
                } 
                else if ((l.isLeft && l.x > buildingWidth + 75) || (!l.isLeft && l.x < canvas.width - buildingWidth - 75)) {
                    lilky.splice(i, 1); 
                }
            }
        }
        // ==========================================
        // HLAVNÍ HERNÍ SMYČKA
        // ==========================================
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment(); 
            updateAndDrawLilky();
            drawPlayer();      

            requestAnimationFrame(gameLoop);
        }

        playerImg.onload = () => {
            gameLoop();
        };
        if(playerImg.complete) {
            gameLoop();
        }
    </script>
</body>
</html>
