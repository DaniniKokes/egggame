<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Egg & Lilek - Top Boxes Edition</title>
    <style>
        body { 
            margin: 0; 
            background: #0d0d0d; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace;
        }
        canvas { 
            border: 4px solid #222; 
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            background: #2b2b2b; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ==========================================
        // WEBS AUDIO API (GENEROVÁNÍ ZVUKŮ)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            if (type === 'catch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.setValueAtTime(200, now + 0.15);
                osc.frequency.setValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'shop') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(900, now + 0.15);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // ==========================================
        // SEKCE 1: BUDOVY, ULICE, SHOP A BOXES
        // ==========================================
        const buildingWidth = 220;
        const themeColor = "#111111";

        const rooms = [
            { id: 0, side: 'left',  y: 55 },
            { id: 1, side: 'left',  y: 275 },
            { id: 2, side: 'right', y: 55 },
            { id: 3, side: 'right', y: 275 }
        ];

        let isShopOpen = false;
        let shopTriggered = false; 
        let unlockedBoxes = { box1: true, box2: false, box3: false };
        let activeBox = 1;

        function drawCleanBrickBuilding(startX, width, side) {
            ctx.fillStyle = "#A52A2A";
            ctx.fillRect(startX, 0, width, canvas.height - 100);
            
            ctx.fillStyle = "#8B0000";
            for (let i = 0; i < canvas.height - 100; i += 25) {
                for (let j = 0; j < width - 20; j += 45) {
                    let brickX = side === 'left' ? startX + j : startX + 20 + j;
                    ctx.fillRect(brickX, i, 40, 20);
                }
            }

            ctx.fillStyle = "#A52A2A";
            if (side === 'left') {
                ctx.fillRect(startX + width - 20, 0, 20, canvas.height - 100);
            } else {
                ctx.fillRect(startX, 0, 20, canvas.height - 100);
            }
        }

        function drawEnvironment() {
            ctx.fillStyle = "#2b2b2b";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#7c7c7c";
            ctx.fillRect(buildingWidth, 0, 30, canvas.height - 100); 
            ctx.fillRect(canvas.width - buildingWidth - 30, 0, 30, canvas.height - 100); 

            drawCleanBrickBuilding(0, buildingWidth, 'left');
            drawCleanBrickBuilding(canvas.width - buildingWidth, buildingWidth, 'right');

            // Vchod do obchodu v pravé červené budově dole
            let shopUnlocked = score >= 100;
            ctx.fillStyle = "#111";
            ctx.fillRect(canvas.width - buildingWidth + 40, canvas.height - 180, 80, 80);
            ctx.strokeStyle = shopUnlocked ? "#27ae60" : "#555";
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width - buildingWidth + 40, canvas.height - 180, 80, 80);

            ctx.fillStyle = shopUnlocked ? "#27ae60" : "#777";
            ctx.font = "bold 13px 'Courier New', Courier, monospace";
            ctx.fillText("SHOP", canvas.width - buildingWidth + 60, canvas.height - 135);

            ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
            let zebraTopY = 195;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraTopY, 14, 35);
            }

            let zebraBottomY = 415;
            for (let x = buildingWidth + 30; x < canvas.width - buildingWidth - 30; x += 25) {
                ctx.fillRect(x, zebraBottomY, 14, 35);
            }

            ctx.strokeStyle = "#f1c40f";
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height - 100);
            ctx.stroke();
            ctx.setLineDash([]); 

            rooms.forEach(r => {
                if (r.side === 'left') {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(0, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(buildingWidth - 20, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(buildingWidth, r.y + 70);
                    ctx.lineTo(buildingWidth + 70, r.y + 130);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = "#d49a4f";
                    ctx.fillRect(canvas.width - buildingWidth + 20, r.y - 15, buildingWidth - 20, 85);
                    ctx.fillStyle = themeColor;
                    ctx.fillRect(canvas.width - buildingWidth, r.y + 20, 20, 50);

                    ctx.strokeStyle = themeColor;
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.moveTo(canvas.width - buildingWidth, r.y + 70);
                    ctx.lineTo(canvas.width - buildingWidth - 70, r.y + 130);
                    ctx.stroke();
                }
            });

            // Asfalt (spodek)
            ctx.fillStyle = "#1a1a1a";
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // ==========================================
        // VYKRESLENÍ KRABIC NA HORNÍ LIŠTĚ
        // ==========================================
        function drawTopBoxes() {
            let startX = canvas.width / 2 - 165;
            let boxWidth = 100;
            let boxHeight = 45;
            let y = 15;

            const boxesData = [
                { id: 1, name: "100 EGG", unlocked: true },
                { id: 2, name: "250 EGG", unlocked: unlockedBoxes.box2 },
                { id: 3, name: "500 EGG", unlocked: unlockedBoxes.box3 }
            ];

            boxesData.forEach((b, index) => {
                let x = startX + (index * 115);
                
                // Tělo krabice
                ctx.fillStyle = activeBox === b.id ? "#2980b9" : (b.unlocked ? "#8e44ad" : "#444");
                ctx.fillRect(x, y + 10, boxWidth, boxHeight - 10);
                
                // Víko krabice
                ctx.fillStyle = activeBox === b.id ? "#3498db" : (b.unlocked ? "#9b59b6" : "#555");
                ctx.fillRect(x - 4, y, boxWidth + 8, 12);

                // Ohraničení krabice
                ctx.strokeStyle = b.unlocked ? "#f1c40f" : "#666";
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y + 10, boxWidth, boxHeight - 10);
                ctx.strokeRect(x - 4, y, boxWidth + 8, 12);

                // Text v krabici
                ctx.fillStyle = b.unlocked ? "#ffffff" : "#888";
                ctx.font = "bold 12px 'Courier New', Courier, monospace";
                ctx.fillText(b.name, x + 12, y + 32);
            });
        }

        // ==========================================
        // SEKCE 2: PANÁČEK A OVLÁDÁNÍ
        // ==========================================
        const playerImg = new Image();
        playerImg.src = "player.png";

        const positions = [
            { x: buildingWidth + 50, y: 155, roomIndex: 0, side: 'left' },  
            { x: buildingWidth + 50, y: 375, roomIndex: 1, side: 'left' },  
            { x: canvas.width - buildingWidth - 95, y: 155, roomIndex: 2, side: 'right' }, 
            { x: canvas.width - buildingWidth - 95, y: 375, roomIndex: 3, side: 'right' }  
        ];

        let currentPosIndex = 1;
        let animTimer = 0;
        let isMovingEffect = false;
        let score = 0;
        let lives = 3;
        let isGameOver = false;
        let isPaused = false;

        window.addEventListener("keydown", (e) => {
            if (isShopOpen) {
                if (e.key === "Escape" || e.key === "Enter") {
                    isShopOpen = false;
                }
                return;
            }

            if (e.code === "Space") {
                if (!isGameOver) {
                    isPaused = !isPaused;
                    playSound('shop');
                    if (!isPaused) {
                        gameLoop();
                    }
                }
                return;
            }

            if (isGameOver) {
                if (e.key === "Enter") restartGame();
                return;
            }

            if (isPaused) return;

            let oldIndex = currentPosIndex;
            if (e.key === "ArrowUp") {
                if (currentPosIndex === 1) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 2;
            }
            if (e.key === "ArrowDown") {
                if (currentPosIndex === 0) currentPosIndex = 1;
                if (currentPosIndex === 2) currentPosIndex = 3;
            }
            if (e.key === "ArrowLeft") {
                if (currentPosIndex === 2) currentPosIndex = 0;
                if (currentPosIndex === 3) currentPosIndex = 1;
            }
            if (e.key === "ArrowRight") {
                if (currentPosIndex === 0) currentPosIndex = 2;
                if (currentPosIndex === 1) currentPosIndex = 3;
            }

            if (oldIndex !== currentPosIndex) {
                isMovingEffect = true;
                animTimer = 10;
            }
        });

        // Kliknutí myší v shopu pro nákup boxů
        window.addEventListener("click", (e) => {
            if (!isShopOpen) return;

            let rect = canvas.getBoundingClientRect();
            let mouseX = e.clientX - rect.left;
            let mouseY = e.clientY - rect.top;

            // Box 2 (0.5 USDC)
            if (mouseX >= canvas.width / 2 - 75 && mouseX <= canvas.width / 2 + 75 && mouseY >= 220 && mouseY <= 360) {
                unlockedBoxes.box2 = true; 
                activeBox = 2; 
                playSound('shop');
            }
            // Box 3 (1 USDC)
            if (mouseX >= canvas.width / 2 + 120 && mouseX <= canvas.width / 2 + 270 && mouseY >= 220 && mouseY <= 360) {
                unlockedBoxes.box3 = true; 
                activeBox = 3; 
                playSound('shop');
            }
        });

        function drawPlayer() {
            let targetPos = positions[currentPosIndex];
            let width = 45;
            let height = 65;
            let renderX = targetPos.x;
            let renderY = targetPos.y;

            if (isMovingEffect) {
                animTimer--;
                width += 6;
                height -= 6;
                renderY += 4;
                if (animTimer <= 0) isMovingEffect = false;
            }

            ctx.save();
            if (targetPos.side === 'right') {
                ctx.translate(renderX + width / 2, renderY + height / 2);
                ctx.scale(-1, 1);
                ctx.translate(-(renderX + width / 2), -(renderY + height / 2));
            }

            if (playerImg.complete) {
                ctx.drawImage(playerImg, renderX, renderY, width, height);
            }
            ctx.restore();
        }

        // ==========================================
        // SEKCE 3: LILKY, RYCHLOST A PADÁNÍ NA ZEM
        // ==========================================
        const lilekImg = new Image();
        lilekImg.src = "lilek.png"; 

        let lilky = [];
        let spawnCounter = 0;
        let baseSpeed = 0.5; 

        function spawnLilek() {
            let rIdx = Math.floor(Math.random() * 4);
            let r = rooms[rIdx];

            let isLeft = r.side === 'left';
            let startX = isLeft ? 30 : canvas.width - 30;
            let startY = r.y + 70; 

            lilky.push({
                roomIndex: rIdx,
                x: startX,
                y: startY,
                isLeft: isLeft,
                speed: baseSpeed,
                state: 'room', 
                angle: 0,
                counted: false
            });
        }

        function updateAndDrawLilky() {
            if (!isPaused && !isGameOver && !isShopOpen) {
                spawnCounter++;
                let currentSpawnInterval = Math.max(90, 180 - (score * 2));

                if (spawnCounter > currentSpawnInterval) { 
                    spawnLilek();
                    spawnCounter = 0;
                }
            }

            for (let i = lilky.length - 1; i >= 0; i--) {
                let l = lilky[i];
                let r = rooms[l.roomIndex];

                if (!isPaused && !isGameOver && !isShopOpen) {
                    if (l.state === 'room') {
                        let windowX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                        l.x += l.isLeft ? l.speed : -l.speed;
                        l.y = r.y + 70;
                        l.angle += l.isLeft ? 0.04 : -0.04;

                        if ((l.isLeft && l.x >= windowX) || (!l.isLeft && l.x <= windowX)) {
                            l.state = 'ramp';
                        }
                    } 
                    else if (l.state === 'ramp') {
                        let rampStartX = l.isLeft ? buildingWidth : (canvas.width - buildingWidth);
                        let rampStartY = r.y + 70;

                        l.x += l.isLeft ? l.speed : -l.speed;
                        let progress = l.isLeft ? (l.x - rampStartX) / 70 : (rampStartX - l.x) / 70;
                        l.y = rampStartY + (progress * 60) - 6;
                        l.angle += l.isLeft ? 0.06 : -0.06;

                        let targetPos = positions[l.roomIndex];
                        let catchAreaX = targetPos.x + 15;
                        let catchAreaY = targetPos.y + 20;
                        let distance = Math.hypot(l.x - catchAreaX, l.y - catchAreaY);

                        if (distance < 32 && currentPosIndex === l.roomIndex) {
                            playSound('catch'); 
                            lilky.splice(i, 1); 
                            score++;
                            baseSpeed = 0.5 + (score * 0.01); 

                            // Kontrola dosažení 100 lilků -> automatický vstup do obchodu
                            if (score >= 100 && !shopTriggered) {
                                shopTriggered = true;
                                isShopOpen = true;
                                playSound('shop');
                            }

                            continue;
                        }

                        let rampEndX = l.isLeft ? (buildingWidth + 70) : (canvas.width - buildingWidth - 70);
                        if ((l.isLeft && l.x >= rampEndX) || (!l.isLeft && l.x < rampEndX)) {
                            l.state = 'falling';
                        }
                    } 
                    else if (l.state === 'falling') {
                        l.y += 4; 
                        l.angle += 0.1;

                        let groundY = canvas.height - 120;
                        if (l.y >= groundY) {
                            l.y = groundY;
                            l.state = 'ground';
                            
                            if (!l.counted) {
                                playSound('drop'); 
                                lives--;
                                l.counted = true;
                                if (lives <= 0) {
                                    playSound('gameover');
                                    isGameOver = true;
                                }
                            }
                        }
                    }
                }

                ctx.save();
                ctx.translate(l.x, l.y - 10);
                ctx.rotate(l.angle);

                if (lilekImg.complete && lilekImg.naturalWidth !== 0) {
                    ctx.drawImage(lilekImg, -15, -15, 30, 30);
                } else {
                    ctx.fillStyle = "#800080";
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                if (!isPaused && l.state === 'ground') {
                    if (Math.random() < 0.03) {
                        lilky.splice(i, 1);
                    }
                }
            }
        }

        // ==========================================
        // UI, SHOP, PAUSE A GAME OVER
        // ==========================================
        function drawUI() {
            ctx.font = "bold 15px 'Courier New', Courier, monospace";

            // Levá budova: Skóre
            ctx.fillStyle = "rgba(15, 15, 15, 0.85)";
            ctx.beginPath();
            ctx.roundRect(15, 15, 130, 45, 8);
            ctx.fill();
            ctx.strokeStyle = "#3498db";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#3498db";
            ctx.fillText("SCORE", 25, 33);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px 'Courier New', Courier, monospace";
            ctx.fillText(score, 25, 52);

            // Vykreslení krabic nahoře
            drawTopBoxes();

            // Pravá budova: Životy
            ctx.font = "bold 15px 'Courier New', Courier, monospace";
            ctx.fillStyle = "rgba(15, 15, 15, 0.85)";
            ctx.beginPath();
            ctx.roundRect(canvas.width - 145, 15, 130, 45, 8);
            ctx.fill();
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#e74c3c";
            ctx.fillText("LIVES", canvas.width - 135, 33);
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px 'Courier New', Courier, monospace";
            ctx.fillText("❤️ ".repeat(Math.max(0, lives)), canvas.width - 135, 52);
        }

        function drawShopScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 35px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText("WEB3 EGGPLANT SHOP", canvas.width / 2, 120);

            ctx.fillStyle = "#ffffff";
            ctx.font = "16px 'Courier New', Courier, monospace";
            ctx.fillText("Milestone reached! Upgrade your boxes using USDC", canvas.width / 2, 160);

            // Box 1 (Free)
            ctx.fillStyle = "#222";
            ctx.fillRect(canvas.width / 2 - 270, 220, 150, 140);
            ctx.strokeStyle = "#3498db";
            ctx.strokeRect(canvas.width / 2 - 270, 220, 150, 140);
            ctx.fillStyle = "#3498db";
            ctx.fillText("100 EGG BOX", canvas.width / 2 - 195, 250);
            ctx.fillStyle = "#fff";
            ctx.fillText("Price: 0 USDC", canvas.width / 2 - 195, 290);
            ctx.fillStyle = "#27ae60";
            ctx.fillText("UNLOCKED", canvas.width / 2 - 195, 330);

            // Box 2 (0.5 USDC)
            ctx.fillStyle = "#222";
            ctx.fillRect(canvas.width / 2 - 75, 220, 150, 140);
            ctx.strokeStyle = unlockedBoxes.box2 ? "#27ae60" : "#f1c40f";
            ctx.strokeRect(canvas.width / 2 - 75, 220, 150, 140);
            ctx.fillStyle = "#f1c40f";
            ctx.fillText("250 EGG BOX", canvas.width / 2, 250);
            ctx.fillStyle = "#fff";
            ctx.fillText("Price: 0.5 USDC", canvas.width / 2, 290);
            ctx.fillStyle = unlockedBoxes.box2 ? "#27ae60" : "#f1c40f";
            ctx.fillText(unlockedBoxes.box2 ? "ACTIVE" : "BUY (Click)", canvas.width / 2, 330);

            // Box 3 (1 USDC)
            ctx.fillStyle = "#222";
            ctx.fillRect(canvas.width / 2 + 120, 220, 150, 140);
            ctx.strokeStyle = unlockedBoxes.box3 ? "#27ae60" : "#f1c40f";
            ctx.strokeRect(canvas.width / 2 + 120, 220, 150, 140);
            ctx.fillStyle = "#f1c40f";
            ctx.fillText("500 EGG BOX", canvas.width / 2 + 195, 250);
            ctx.fillStyle = "#fff";
            ctx.fillText("Price: 1 USDC", canvas.width / 2 + 195, 290);
            ctx.fillStyle = unlockedBoxes.box3 ? "#27ae60" : "#f1c40f";
            ctx.fillText(unlockedBoxes.box3 ? "ACTIVE" : "BUY (Click)", canvas.width / 2 + 195, 330);

            ctx.fillStyle = "#aaa";
            ctx.font = "14px 'Courier New', Courier, monospace";
            ctx.fillText("Press ESC or ENTER to return to game", canvas.width / 2, 450);
            ctx.textAlign = "start";
        }

        function drawPauseScreen() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 45px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 15);

            ctx.fillStyle = "#ffffff";
            ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Press SPACE to resume", canvas.width / 2, canvas.height / 2 + 30);
            ctx.textAlign = "start";
        }

        function drawGameOver() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff4d4d";
            ctx.font = "bold 45px 'Courier New', Courier, monospace";
            ctx.textAlign = "center";
            ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 30);

            ctx.fillStyle = "#ffffff";
            ctx.font = "22px 'Courier New', Courier, monospace";
            ctx.fillText("Eggplants caught: " + score, canvas.width / 2, canvas.height / 2 + 20);
            
            ctx.fillStyle = "#f1c40f";
            ctx.font = "18px 'Courier New', Courier, monospace";
            ctx.fillText("Press ENTER to restart", canvas.width / 2, canvas.height / 2 + 70);
            ctx.textAlign = "start";
        }

        function restartGame() {
            score = 0;
            lives = 3;
            baseSpeed = 0.5;
            lilky = [];
            isGameOver = false;
            isPaused = false;
            isShopOpen = false;
            shopTriggered = false;
            unlockedBoxes = { box1: true, box2: false, box3: false };
            activeBox = 1;
            gameLoop();
        }

        // ==========================================
        // HLAVNÍ HERNÍ SMYČKA
        // ==========================================
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            drawEnvironment(); 
            updateAndDrawLilky();
            drawPlayer();      
            drawUI();

            if (isGameOver) {
                drawGameOver();
                return; 
            }

            if (isShopOpen) {
                drawShopScreen();
                requestAnimationFrame(gameLoop);
                return;
            }

            if (isPaused) {
                drawPauseScreen();
                return; 
            }

            requestAnimationFrame(gameLoop);
        }

        playerImg.onload = () => {
            gameLoop();
        };
        if(playerImg.complete) {
            gameLoop();
        }
    </script>
</body>
</html>
